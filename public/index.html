<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Time Period Timelapse</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      overflow: hidden;
    }
    h1 {
      text-align: center;
      color: #8B4513;
      margin: 20px;
    }
    .slider-container {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 100;
    }
    .year-btn {
      padding: 8px 16px;
      border: 2px solid #8B4513;
      background: transparent;
      color: #8B4513;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.3s ease;
    }
    .year-btn:hover {
      background: #8B4513;
      color: white;
    }
    .year-btn.active {
      background: #8B4513;
      color: white;
    }
    #renderer-container {
      width: 100%;
      height: 100%;
      background: #111;
    }
    @media (max-width: 600px) {
      .year-btn {
        padding: 6px 12px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>
  <h1>Café Time Period Timelapse</h1>
  
  <div class="slider-container" id="sliderContainer">
    <!-- Year buttons injected by JavaScript -->
  </div>

  <canvas id="renderer-container"></canvas>

  <script type="module" src="/src/scene.js"></script>
</body>
</html>
