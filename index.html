<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Standalone browser-based 2D city simulation." />
    <link rel="icon" href="data:," />
    <title>Live City Simulation</title>
  </head>
  <body>
    <!--
      The app shell: every slot the composition root mounts into.

      - `#city-canvas`   the city canvas the renderer draws into
      - `#minimap`       overlay slot the minimap canvas is mounted into
      - `#app`           positioned host for the HUD, the inspector and the
                         minimap slot, so all overlays share one coordinate space

      Loading the module below composes the simulation and starts it: there is no
      start button, and the first frame is drawn on load.
    -->
    <div id="app">
      <canvas id="city-canvas" aria-label="Live city simulation"></canvas>
      <div id="minimap" class="minimap"></div>
      <p class="city-controls" role="note" aria-label="Controls">
        <span class="city-controls__item">Drag to pan</span>
        <span class="city-controls__item">Wheel to zoom</span>
        <span class="city-controls__item">Click to inspect</span>
        <span class="city-controls__item">Space to pause</span>
        <span class="city-controls__item">1/2/3 for speed</span>
      </p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
