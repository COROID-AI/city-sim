<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230d141b'/%3E%3Cpath d='M3 3h8v6a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3z' fill='%23e8b55c'/%3E%3Crect x='11' y='6' width='2.4' height='3' rx='1' fill='%23e8b55c'/%3E%3C/svg%3E"
    />
    <title>Café — 2025</title>
    <style>
      :root {
        --panel: rgba(14, 20, 28, 0.82);
        --panel-border: rgba(236, 197, 122, 0.45);
        --ink: #f2ead8;
        --muted: #b9ac93;
        --accent: #e8b55c;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #0d141b;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--ink);
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* Top timeline — always visible across the top of the viewport. */
      #topbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 10px 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--panel-border);
        backdrop-filter: blur(6px);
        pointer-events: none;
      }
      #topbar > * {
        pointer-events: auto;
      }
      .brand {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
        white-space: nowrap;
      }
      .brand strong {
        font-size: 15px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      .brand small {
        color: var(--muted);
        font-size: 12px;
      }
      .timeline {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
        min-width: 0;
      }
      .timeline-label {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        white-space: nowrap;
      }
      .audio-controls {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .audio-controls button {
        border: 1px solid rgba(236, 197, 122, 0.35);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        line-height: 1;
        padding: 6px 8px;
        cursor: pointer;
      }
      .audio-controls button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .audio-controls input {
        width: 72px;
        accent-color: var(--accent);
        cursor: pointer;
      }
      #timeline-slider {
        flex: 1;
        min-width: 220px;
        accent-color: var(--accent);
        cursor: pointer;
      }
      .timeline { flex-direction: column; align-items: stretch; gap: 2px; }
      .timeline-main { display: flex; align-items: center; gap: 10px; }
      .era-slider { position: relative; flex: 1; min-width: 240px; height: 52px; }
      .era-slider #timeline-slider { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; z-index: 3; }
      .era-rail { position: absolute; inset: 0; pointer-events: none; --fill: 100%; }
      .era-track { position: absolute; left: 10px; right: 10px; top: 12px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--accent) var(--fill), rgba(255,255,255,.14) var(--fill)); }
      .era-thumb { position: absolute; top: 14px; left: 100%; width: 18px; height: 18px; transform: translate(-50%,-50%); border: 2px solid rgba(255,255,255,.9); border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); transition: left 2.5s cubic-bezier(.22,1,.36,1); }
      .era-slider.dragging .era-thumb { transition: none; }
      .era-stop { position: absolute; top: 25px; transform: translateX(-50%); z-index: 4; padding: 5px 7px; border: 1px solid transparent; border-radius: 6px; background: transparent; color: var(--muted); font: 600 12px/1 inherit; cursor: pointer; pointer-events: auto; transition: color .15s ease, background .15s ease, border-color .15s ease; }
      .era-stop:hover, .era-stop:focus-visible { color: var(--accent); border-color: rgba(236,197,122,.45); background: rgba(255,255,255,.06); outline: none; }
      .era-stop.active { color: var(--accent); border-color: rgba(236,197,122,.55); background: rgba(236,197,122,.12); font-weight: 800; }
      .era-stop:disabled { opacity: .4; cursor: default; }
      .era-caption { min-height: 16px; color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .caption-name { font-weight: 800; }
      #timeline-slider:focus-visible ~ .era-rail { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
      .year-buttons {
        display: flex;
        gap: 6px;
      }
      .year-btn {
        border: 1px solid rgba(236, 197, 122, 0.35);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--ink);
        font: inherit;
        font-size: 13px;
        line-height: 1;
        padding: 8px 10px;
        cursor: pointer;
        transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      }
      .year-btn:hover {
        border-color: var(--accent);
      }
      .year-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .year-btn.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #241a0c;
        font-weight: 700;
      }
      /* Era label HUD. */
      #era-chip {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 20;
        padding: 10px 14px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.4;
        pointer-events: none;
      }
      #era-chip .year {
        font-size: 22px;
        font-weight: 800;
        color: var(--accent);
      }
      #era-chip .status {
        display: block;
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }
      #version {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 20;
        color: var(--muted);
        font-size: 12px;
        opacity: 0.8;
        pointer-events: none;
      }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 20;
        color: var(--muted);
        font-size: 12px;
        background: rgba(14, 20, 28, 0.55);
        padding: 6px 10px;
        border-radius: 6px;
        pointer-events: none;
        white-space: nowrap;
      }
      /* Audio controls — mute + volume for the ambient soundscape. */
      #audio-panel {
        position: fixed;
        right: 16px;
        top: 64px;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      #audio-panel .mute-btn {
        border: 1px solid rgba(236, 197, 122, 0.35);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--ink);
        font: inherit;
        font-size: 12px;
        line-height: 1;
        padding: 4px 8px;
        cursor: pointer;
      }
      #audio-panel .mute-btn[aria-pressed="true"] {
        background: var(--accent);
        color: #241a0c;
      }
      #audio-volume {
        width: 90px;
        accent-color: var(--accent);
        cursor: pointer;
      }
      .explore-wrap { position: relative; white-space: nowrap; }
      #explore-toggle { border: 1px solid rgba(236,197,122,.35); border-radius: 6px; background: rgba(255,255,255,.04); color: var(--ink); padding: 8px 10px; font: inherit; font-size: 13px; cursor: pointer; }
      #explore-toggle:hover, #explore-toggle:focus-visible { border-color: var(--accent); outline: 2px solid transparent; }
      #explore-menu { position: absolute; top: calc(100% + 6px); right: 0; display: none; min-width: 190px; padding: 5px; z-index: 40; background: rgba(14,20,28,.97); border: 1px solid var(--panel-border); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
      #explore-menu.open { display: grid; gap: 3px; }
      .explore-item { width: 100%; padding: 8px 10px; border: 0; border-radius: 5px; background: transparent; color: var(--ink); text-align: left; font: inherit; font-size: 13px; cursor: pointer; }
      .explore-item:hover, .explore-item:focus-visible { background: rgba(255,255,255,.07); color: var(--accent); outline: none; }
      .explore-sep { height: 1px; margin: 4px 5px; background: rgba(236,197,122,.2); }
      #info-card { position: fixed; right: 16px; bottom: 56px; z-index: 35; display: none; width: min(340px, calc(100vw - 32px)); padding: 13px 15px; background: rgba(14,20,28,.96); border: 1px solid var(--panel-border); border-left: 3px solid var(--accent); border-radius: 9px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
      #info-card.open { display: block; animation: info-in .2s ease; }
      @keyframes info-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      #info-close { position: absolute; right: 7px; top: 5px; border: 0; background: transparent; color: var(--muted); font-size: 18px; cursor: pointer; }
      #info-name { padding-right: 22px; font-size: 15px; font-weight: 800; }
      #info-story { margin-top: 5px; color: var(--muted); font-size: 13px; line-height: 1.45; }
      #info-era { margin-top: 9px; color: var(--accent); font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      @media (max-width: 720px) {
        #topbar {
          flex-wrap: wrap;
          gap: 8px;
        }
        .brand small {
          display: none;
        }
        #hint {
          display: none;
        }
        #audio-panel {
          top: auto;
          bottom: 56px;
        }
        .timeline-main { width: 100%; }
        .timeline { width: 100%; }
        .era-slider { min-width: 0; }
        #info-card { right: 10px; bottom: 12px; }
      }
    </style>
    <!-- Single shared three.js instance for app + addons via import map. -->
    <script type="importmap">
      {
        "imports": {
          "three": "./public/js/three/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app"></div>

    <div id="topbar" role="toolbar" aria-label="Café time period timeline">
      <div class="brand">
        <strong>Le Café</strong>
        <small>timelapse · 1945 → 2025</small>
      </div>
      <div class="timeline">
        <div class="timeline-main">
          <span class="timeline-label" id="timeline-label">Era</span>
          <div class="era-slider" id="era-slider">
            <input type="range" id="timeline-slider" min="0" max="4" step="1" value="4" aria-label="Select café era" aria-valuemin="0" aria-valuemax="4" aria-valuenow="4" aria-valuetext="2025" />
            <div class="era-rail" id="era-rail" aria-hidden="true">
              <div class="era-track"></div>
              <div class="era-thumb"></div>
            </div>
          </div>
        </div>
        <div class="era-caption" id="era-caption" aria-live="polite"></div>
        <div class="audio-controls" aria-label="Audio controls">
          <button id="audio-mute" type="button" aria-label="Mute or unmute audio">🔊</button>
          <label for="audio-volume" class="timeline-label">Vol</label>
          <input id="audio-volume" type="range" min="0" max="1" step="0.01" value="0.62" aria-label="Audio volume" />
        </div>
      </div>
      <div class="explore-wrap">
        <button type="button" id="explore-toggle" aria-haspopup="menu" aria-expanded="false">Explore ▾</button>
        <div id="explore-menu" role="menu" aria-label="Explore camera presets"></div>
      </div>
    </div>

    <div id="era-chip" role="status" aria-live="polite">
      <div class="year" id="era-year">2025</div>
      <div class="status" id="era-status">UNDER CONSTRUCTION</div>
    </div>
    <div id="version"></div>
    <div id="hint">Drag to orbit · scroll to zoom · right-drag to pan</div>

    <div id="audio-panel" role="group" aria-label="Sound controls">
      <button
        type="button"
        class="mute-btn"
        id="audio-mute"
        aria-pressed="false"
        title="Mute ambient sound and music"
      >Mute</button>
      <label for="audio-volume">Vol</label>
      <input
        type="range"
        id="audio-volume"
        min="0"
        max="1"
        step="0.05"
        value="0.8"
        aria-label="Sound volume"
      />
    </div>

    <div id="info-card" role="dialog" aria-label="Object information" aria-hidden="true">
      <button type="button" id="info-close" aria-label="Close information">×</button>
      <div id="info-name"></div>
      <div id="info-story"></div>
      <div id="info-era"></div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
