<!doctype html>
<html lang="en" data-chrono-boot="pending">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05070d" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23070b14'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%236fd3ff' stroke-width='2.5'/%3E%3Cpath d='M16 11v5l4 2' fill='none' stroke='%236fd3ff' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Chrono City — a standalone 3D city block that travels through five eras, running entirely in the browser."
    />
    <title>Chrono City</title>
  </head>
  <body>
    <!-- WebGL stage: the renderer canvas is mounted here by src/main.ts. -->
    <div id="app" class="chrono-stage" data-chrono-stage></div>

    <!-- Overlay root: the HUD lives here, above the canvas, and stays empty until
         the overlay systems register themselves. -->
    <div id="overlay" class="chrono-overlay" data-chrono-overlay aria-label="Chrono City overlay"></div>

    <noscript>Chrono City needs JavaScript and WebGL enabled to run.</noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
