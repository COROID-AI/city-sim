/* Hash based value noise + fbm, shared by every exhaust shader. */
const EX_NOISE_GLSL = [
  'float exHash(vec3 p) { return fract(sin(dot(p, vec3(127.1, 311.7, 74.7))) * 43758.5453123); }',
  'float exNoise(vec3 p) {',
  '  vec3 i = floor(p);',
  '  vec3 f = fract(p);',
  '  f = f * f * (3.0 - 2.0 * f);',
  '  float n000 = exHash(i);',
  '  float n100 = exHash(i + vec3(1.0, 0.0, 0.0));',
  '  float n010 = exHash(i + vec3(0.0, 1.0, 0.0));',
  '  float n110 = exHash(i + vec3(1.0, 1.0, 0.0));',
  '  float n001 = exHash(i + vec3(0.0, 0.0, 1.0));',
  '  float n101 = exHash(i + vec3(1.0, 0.0, 1.0));',
  '  float n011 = exHash(i + vec3(0.0, 1.0, 1.0));',
  '  float n111 = exHash(i + vec3(1.0, 1.0, 1.0));',
  '  return mix(mix(mix(n000, n100, f.x), mix(n010, n110, f.x), f.y),',
  '             mix(mix(n001, n101, f.x), mix(n011, n111, f.x), f.y), f.z);',
  '}',
  'float exFbm(vec3 p) {',
  '  float sum = 0.0;',
  '  float amp = 0.5;',
  '  for (int i = 0; i < 4; i++) { sum += amp * exNoise(p); p *= 2.03; amp *= 0.5; }',
  '  return sum;',
  '}'
].join('\n');

/* Tone mapping + output colour space chunks, so the additive fire sits on the
 * same ACES curve as the lit geometry and the shimmer veil reproduces the
 * frame behind it exactly where its distortion is zero. */
const EX_OUTPUT_GLSL = [
  '#include <tonemapping_fragment>',
  '#include <colorspace_fragment>'
].join('\n');

/* Flame layer vertex shader: one unit cone per engine bell, stretched and
 * licked by per-instance attributes, positioned by the anchor world matrix. */
const EX_FLAME_VERT = [
  EX_NOISE_GLSL,
  'attribute float aLength;',
  'attribute float aWidth;',
  'attribute float aPhase;',
  'attribute float aJitter;',
  'uniform float uTime;',
  'uniform float uSway;',
  'uniform float uSeed;',
  'varying vec2 vUv;',
  'varying float vPhase;',
  'varying float vRim;',
  'void main() {',
  '  vUv = uv;',
  '  vPhase = aPhase;',
  '  float along = 1.0 - uv.y;',              /* 0 at the bell exit, 1 at the tip */
  '  float t = uTime + aPhase * 9.0;',
  '  float lick = exFbm(vec3(uv.x * 2.4, uv.y * 5.0 - t * 2.6, uSeed + aPhase * 3.0)) - 0.5;',
  '  float swirl = exFbm(vec3(uv.y * 5.0 - t * 2.1, uv.x * 2.4 + 19.0, uSeed * 1.7 + aPhase)) - 0.5;',
  '  vec3 pos = position;',
  '  pos.y *= aLength;',                       /* the bell exit stays pinned at y = 0 */
  '  float breathe = 1.0 + 0.24 * aJitter * sin(uTime * 9.0 + aPhase * 11.0);',
  '  pos.xz *= aWidth * breathe;',
  '  float amp = uSway * (0.12 + along * along * 1.4) * min(aLength, 14.0) * 0.09;',
  '  pos.x += lick * amp;',
  '  pos.z += swirl * amp;',
  '  vec3 viewNormal = normalize(normalMatrix * (mat3(instanceMatrix) * normalize(normal)));',
  '  vRim = 1.0 - abs(viewNormal.z);',
  '  gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(pos, 1.0);',
  '}'
].join('\n');

/* Flame fragment shader: parameterised across the three fire layers - a
 * near-white hot core, a saturated glow and patchy trailing tongues. */
const EX_FLAME_FRAG = [
  EX_NOISE_GLSL,
  'uniform vec3 uHot;',
  'uniform vec3 uWarm;',
  'uniform vec3 uCool;',
  'uniform float uTime;',
  'uniform float uLevel;',
  'uniform float uSeed;',
  'uniform float uIntensity;',
  'uniform float uAlpha;',
  'uniform float uFalloff;',
  'uniform float uNoise;',
  'uniform float uRim;',
  'uniform float uPatch;',
  'varying vec2 vUv;',
  'varying float vPhase;',
  'varying float vRim;',
  'void main() {',
  '  float along = 1.0 - vUv.y;',
  '  float n = exFbm(vec3(vUv.y * uNoise - uTime * 3.1, uSeed + vPhase * 5.0, uTime * 0.75));',
  '  float n2 = exFbm(vec3(vUv.y * uNoise * 2.3 - uTime * 5.2, vUv.x * 2.0 + uSeed, uTime * 1.1));',
  '  float flick = 0.82 + 0.36 * exNoise(vec3(uTime * 5.7 + vPhase * 9.0, vUv.y * 3.0, uSeed));',
  '  float speck = mix(1.0, smoothstep(0.22, 0.86, n2 * 0.6 + 0.42), uPatch);',
  '  float body = (1.0 - smoothstep(0.14, 1.05, along * uFalloff + (n - 0.5) * 0.70)) * speck;',
  '  float hot = pow(clamp(1.0 - along * 1.35, 0.0, 1.0), 0.60);',
  '  vec3 colour = mix(uCool, uWarm, clamp(hot * 1.40, 0.0, 1.0));',
  '  colour = mix(colour, uHot, clamp(hot * hot * 1.55 + (n - 0.5) * 0.35, 0.0, 1.0));',
  '  float soft = mix(1.0, 1.0 - uRim, vRim * vRim);',   /* volumetric silhouette */
  '  float strength = body * flick * soft * uLevel;',
  '  gl_FragColor = vec4(colour * uIntensity * strength, clamp(strength * uAlpha, 0.0, 1.0));',
  EX_OUTPUT_GLSL,
  '}'
].join('\n');

/* Plume column vertex shader: world-space unit cylinder stretched by uniforms
 * so the length and width are functions of thrust and altitude alone. */
const EX_PLUME_VERT = [
  EX_NOISE_GLSL,
  'uniform float uLength;',
  'uniform float uWidth;',
  'uniform float uBillow;',
  'uniform float uTime;',
  'varying vec2 vUv;',
  'varying float vRim;',
  'varying float vAlong;',
  'void main() {',
  '  vUv = uv;',
  '  float along = 1.0 - uv.y;',              /* 0 at the engine, 1 at the tip */
  '  vAlong = along;',
  '  float t = uTime + uv.y * 1.5;',
  '  float billow = exFbm(vec3(uv.x * 3.0, uv.y * 7.0 - t * 1.6, uTime * 0.35)) - 0.5;',
  '  float swirl = exFbm(vec3(uv.y * 6.0 - t * 1.4, uv.x * 3.0 + 23.0, uTime * 0.28)) - 0.5;',
  '  vec3 pos = position;',
  '  pos.y *= uLength;',
  '  pos.xz *= uWidth * (1.0 + along * 0.85);',   /* the jet widens as it falls */
  '  float amp = uBillow * (0.15 + along) * uWidth * 1.6;',
  '  pos.x += billow * amp;',
  '  pos.z += swirl * amp;',
  '  vec3 viewNormal = normalize(normalMatrix * normalize(normal));',
  '  vRim = 1.0 - abs(viewNormal.z);',
  '  gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);',
  '}'
].join('\n');

/* Plume fragment shader: additive, white hot at the throat, cooling down the
 * column, with shock diamonds just below the bells and a soft tip fade. */
const EX_PLUME_FRAG = [
  EX_NOISE_GLSL,
  'uniform vec3 uHot;',
  'uniform vec3 uWarm;',
  'uniform vec3 uCool;',
  'uniform float uTime;',
  'uniform float uLevel;',
  'uniform float uSeed;',
  'uniform float uIntensity;',
  'uniform float uAlpha;',
  'uniform float uOpacity;',
  'uniform float uReps;',
  'uniform float uDiamond;',
  'varying vec2 vUv;',
  'varying float vRim;',
  'varying float vAlong;',
  'void main() {',
  '  float along = vAlong;',
  '  float n = exFbm(vec3(vUv.x * 4.0, vUv.y * uReps - uTime * 2.2, uTime * 0.40 + uSeed)) - 0.5;',
  '  float tip = 1.0 - smoothstep(0.46, 1.0, along + (n - 0.5) * 0.34);',
  '  float throat = smoothstep(0.0, 0.07, along);',
  '  float diamonds = 1.0 + uDiamond * pow(abs(sin(vUv.y * uReps * 1.9)), 6.0);',
  '  float heat = clamp(1.0 - along * 0.90 - vRim * 0.50 + n * 0.9, 0.0, 1.0);',
  '  vec3 colour = mix(uCool, uWarm, clamp(heat * 1.35, 0.0, 1.0));',
  '  colour = mix(colour, uHot, clamp(pow(heat, 2.4) * 1.6, 0.0, 1.0));',
  '  float soft = mix(1.0, 0.28, vRim * vRim);',
  '  float strength = tip * throat * soft * diamonds * uLevel * uOpacity;',
  '  gl_FragColor = vec4(colour * uIntensity * strength, clamp(strength * uAlpha, 0.0, 1.0));',
  EX_OUTPUT_GLSL,
  '}'
].join('\n');

/* Heat shimmer: the veil samples the frame rendered one pass earlier and hands
 * it back through a noise-warped screen UV, so the background visibly writhes
 * while everything outside the veil is untouched. */
const EX_SHIMMER_VERT = [
  EX_NOISE_GLSL,
  'uniform float uLength;',
  'uniform float uWidth;',
  'uniform float uTime;',
  'uniform float uSway;',
  'varying vec2 vUv;',
  'varying vec4 vClip;',
  'varying float vRim;',
  'void main() {',
  '  vUv = uv;',
  '  vec3 pos = position;',
  '  pos.y *= uLength;',
  '  pos.xz *= uWidth;',
  '  float w = exFbm(vec3(uv.x * 3.0, uv.y * 6.0 - uTime * 1.1, uTime * 0.22)) - 0.5;',
  '  pos.x += w * uSway * uWidth;',
  '  pos.z += w * uSway * uWidth * 0.6;',
  '  vec3 viewNormal = normalize(normalMatrix * normalize(normal));',
  '  vRim = 1.0 - abs(viewNormal.z);',
  '  gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);',
  '  vClip = gl_Position;',
  '}'
].join('\n');

/* Ground shimmer vertex shader: a flat plane on the deck, same fragment stage. */
const EX_SHIMMER_FLOOR_VERT = [
  'uniform float uWidth;',
  'varying vec2 vUv;',
  'varying vec4 vClip;',
  'varying float vRim;',
  'void main() {',
  '  vUv = uv;',
  '  vRim = 0.0;',
  '  vec3 pos = vec3(position.xy * uWidth, position.z);',
  '  gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);',
  '  vClip = gl_Position;',
  '}'
].join('\n');

const EX_SHIMMER_FRAG = [
  EX_NOISE_GLSL,
  'uniform sampler2D uScene;',
  'uniform vec3 uTint;',
  'uniform float uTime;',
  'uniform float uHeat;',
  'uniform float uAmp;',
  'uniform float uStrength;',
  'uniform float uHasScene;',
  'varying vec2 vUv;',
  'varying vec4 vClip;',
  'varying float vRim;',
  'void main() {',
  '  float along = 1.0 - vUv.y;',
  '  float n1 = exFbm(vec3(vUv.x * 5.0, vUv.y * 9.0 - uTime * 1.6, uTime * 0.60)) - 0.5;',
  '  float n2 = exFbm(vec3(vUv.y * 11.0 - uTime * 2.1, vUv.x * 5.0 + 31.0, uTime * 0.45)) - 0.5;',
  '  float cells = pow(clamp(0.5 + n1 * 1.7, 0.0, 1.0), 1.6);',
  '  vec2 screenUv = vClip.xy / max(0.0001, vClip.w) * 0.5 + 0.5;',
  '  float amp = uAmp * uHeat * (0.45 + along * 0.75);',
  '  vec2 warped = clamp(screenUv + vec2(n1, n2) * amp, vec2(0.002), vec2(0.998));',
  '  vec3 refracted = texture2D(uScene, warped).rgb;',
  '  vec3 colour = mix(uTint, refracted * uTint, uHasScene * mix(1.0, 0.88, cells));',
  '  float veil = uHeat * uStrength * (0.16 + 0.84 * cells) * (0.30 + 0.70 * along) * mix(1.0, 0.72, vRim);',
  '  gl_FragColor = vec4(colour, clamp(veil, 0.0, 0.80));',
  EX_OUTPUT_GLSL,
  '}'
].join('\n');

/* Additive heat glow painted on the pad deck under the burning engines. */
const EX_GLOW_VERT = [
  'varying vec2 vUv;',
  'void main() {',
  '  vUv = uv;',
  '  gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);',
  '}'
].join('\n');

const EX_GLOW_FRAG = [
  EX_NOISE_GLSL,
  'uniform vec3 uColour;',
  'uniform float uTime;',
  'uniform float uIntensity;',
  'varying vec2 vUv;',
  'void main() {',
  '  float d = length(vUv - vec2(0.5)) * 2.0;',
  '  float core = pow(clamp(1.0 - d, 0.0, 1.0), 2.2);',
  '  float n = exFbm(vec3(vUv * 6.0, uTime * 0.6));',
  '  float strength = clamp(core * (0.70 + 0.60 * n) * uIntensity, 0.0, 1.0);',
  '  gl_FragColor = vec4(uColour * (0.55 + n * 0.9) * uIntensity, strength);',
  EX_OUTPUT_GLSL,
  '}'
].join('\n');

/* Unit flame cone whose top edge sits exactly on the bell exit plane. */
function exConeGeometry(topRadius, bottomRadius, radial, rows) {
  const geometry = new THREE.CylinderGeometry(topRadius, bottomRadius, 1, radial, rows, true);
  geometry.translate(0, -0.5, 0);
  return geometry;
}

/* One additive fire material; every layer shares the shader and only the
 * uniforms change (colour ramp, falloff, intensity, silhouette, patchiness). */
function exFlameMaterial(spec) {
  return new THREE.ShaderMaterial({
    name: 'exhaust-flame-' + spec.name,
    uniforms: {
      uTime: { value: 0 },
      uLevel: { value: 0 },
      uSeed: { value: spec.seed },
      uHot: { value: new THREE.Color(spec.hot) },
      uWarm: { value: new THREE.Color(spec.warm) },
      uCool: { value: new THREE.Color(spec.cool) },
      uIntensity: { value: spec.intensity },
      uAlpha: { value: spec.alpha },
      uFalloff: { value: spec.falloff },
      uNoise: { value: spec.noise },
      uRim: { value: spec.rim },
      uPatch: { value: spec.patch },
      uSway: { value: spec.sway }
    },
    vertexShader: EX_FLAME_VERT,
    fragmentShader: EX_FLAME_FRAG,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: true,
    side: THREE.DoubleSide,
    fog: false
  });
}

function exColumnMaterial(spec, order) {
  return new THREE.ShaderMaterial({
    name: 'exhaust-plume-' + order,
    uniforms: {
      uTime: { value: 0 },
      uLevel: { value: 0 },
      uSeed: { value: spec.seed },
      uLength: { value: 1 },
      uWidth: { value: 1 },
      uBillow: { value: spec.billow },
      uReps: { value: 6 },
      uDiamond: { value: spec.diamond },
      uHot: { value: new THREE.Color(spec.hot) },
      uWarm: { value: new THREE.Color(spec.warm) },
      uCool: { value: new THREE.Color(spec.cool) },
      uIntensity: { value: spec.intensity },
      uAlpha: { value: spec.alpha },
      uOpacity: { value: spec.opacity }
    },
    vertexShader: EX_PLUME_VERT,
    fragmentShader: EX_PLUME_FRAG,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: true,
    side: THREE.DoubleSide,
    fog: false
  });
}

function exShimmerMaterial(kind) {
  const floor = kind === 'floor';
  return new THREE.ShaderMaterial({
    name: 'exhaust-shimmer-' + kind,
    uniforms: {
      uScene: { value: null },
      uHasScene: { value: 0 },
      uTint: { value: new THREE.Color(EX_SPEC.shimmer.tint) },
      uTime: { value: 0 },
      uHeat: { value: 0 },
      uAmp: { value: EX_SPEC.shimmer.amp },
      uStrength: { value: EX_SPEC.shimmer.strength },
      uLength: { value: 1 },
      uWidth: { value: 1 },
      uSway: { value: 0.05 }
    },
    vertexShader: floor ? EX_SHIMMER_FLOOR_VERT : EX_SHIMMER_VERT,
    fragmentShader: EX_SHIMMER_FRAG,
    transparent: true,
    blending: THREE.NormalBlending,
    depthWrite: false,
    depthTest: true,
    side: THREE.DoubleSide,
    fog: false
  });
}

function exGlowMaterial() {
  return new THREE.ShaderMaterial({
    name: 'exhaust-ground-glow',
    uniforms: {
      uTime: { value: 0 },
      uIntensity: { value: 0 },
      uColour: { value: new THREE.Color(EX_SPEC.groundGlow.color) }
    },
    vertexShader: EX_GLOW_VERT,
    fragmentShader: EX_GLOW_FRAG,
    transparent: true,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    depthTest: true,
    side: THREE.DoubleSide,
    fog: false
  });
}

/* Per-instance additive flicker: three harmonics so a held throttle still
 * changes the flame size, the tongue length and every shader time uniform. */
function exFlicker(time, phase, seed) {
  return 0.86
    + 0.10 * Math.sin(time * 6.1 + phase * 2.7 + seed)
    + 0.06 * Math.sin(time * 13.7 + phase * 5.1 + seed * 1.7)
    + 0.05 * Math.sin(time * 27.3 + phase * 9.4 + seed * 3.3);
}

function exDisposeList(list) {
  for (let i = 0; i < list.length; i += 1) {
    const item = list[i];
    if (item && typeof item.dispose === 'function') item.dispose();
  }
  list.length = 0;
}

/* Bell-relative radii of the three fire layers (multiples of the bell exit). */
const EX_LAYER_PROFILE = {
  core: { top: 0.95, bottom: 0.20 },
  glow: { top: 1.30, bottom: 0.38 },
  trail: { top: 0.55, bottom: 0.07 }
};

/* PURE FUNCTION of the ramped flame level and the vehicle altitude: the free
 * jet grows with throttle, then stretches towards the pad as the vehicle
 * climbs, so the trail visibly lengthens and thins during the ascent. */
function exPlumeLength(level, engineWorldY) {
  const plume = EX_SPEC.plume;
  const jet = plume.minLength + level * plume.thrustLength;
  const abovePad = Math.max(0, engineWorldY - EX_SPEC.baseY);
  const stretched = (abovePad + plume.minLength) * plume.altitudeStretch;
  return Math.min(plume.maxLength, Math.max(jet, stretched));
}

/* Heat-shimmer refraction budget for the active quality tier. */
function exApplyCaptureTier(system, tier) {
  const id = tier && tier.id ? tier.id : 'high';
  const settings = EX_SPEC.capture[id] || EX_SPEC.capture.high;
  const capture = system.capture;
  capture.enabled = settings.enabled === true && capture.disabled !== true;
  capture.stride = Math.max(1, settings.stride || 1);
  capture.scale = settings.scale > 0 ? settings.scale : 0.4;
  if (capture.enabled) return capture;
  capture.ready = false;
  if (system.materialSet) {
    system.materialSet.shimmer.uniforms.uHasScene.value = 0;
    system.materialSet.shimmerFloor.uniforms.uHasScene.value = 0;
  }
  if (capture.target) {
    capture.target.dispose();
    capture.target = null;
    if (system.materialSet) {
      system.materialSet.shimmer.uniforms.uScene.value = null;
      system.materialSet.shimmerFloor.uniforms.uScene.value = null;
    }
  }
  return capture;
}

/* ---------------------------------------------------------------------------
 * Exhaust subsystem, registered as 'flames'.
 * ------------------------------------------------------------------------ */

const exhaustSystem = {
  scene: null,
  camera: null,
  renderer: null,
  group: null,
  plumeGroup: null,
  shimmerGroup: null,
  shimmerFloor: null,
  glow: null,
  materialSet: null,
  materials: [],
  geometries: [],
  layers: {},
  lights: [],
  lightHandles: [],
  anchors: [],
  rocketHandle: null,
  attached: false,
  bellExitRadius: 1.05,
  clock: 0,
  updates: 0,
  throttle: 0,
  level: 0,
  ignition: 0,
  ignitionTime: 0,
  vacuum: 0,
  flameScale: 0,
  deckWarmth: 0,
  plumeLength: 0,
  plumeWidth: 0,
  gustRadius: 0,
  groundGlowIntensity: 0,
  groundGlowRadius: 0,
  towerDistance: 17.6,
  towerDirection: new THREE.Vector3(0.978, 0, -0.208),
  plumeBase: new THREE.Vector3(),
  plumeAxis: new THREE.Vector3(0, -1, 0),
  plumeQuaternion: new THREE.Quaternion(),
  flameLayers: {
    core: { length: 0, width: 0, count: 0 },
    glow: { length: 0, width: 0, count: 0 },
    trail: { length: 0, width: 0, count: 0 }
  },
  heat: { radius: 0, intensity: 0 },
  shimmerInfo: { group: null, intensity: 0, enabled: false, refracted: false },
  glowHandle: { mesh: null, intensity: 0, radius: 0 },
  plumeSegments: [],
  capture: { target: null, enabled: false, stride: 1, scale: 0.4, frame: 0, ready: false, disabled: false },
  frameHook: null,
  api: null,
  scratch: {
    matrix: new THREE.Matrix4(),
    offset: new THREE.Matrix4(),
    layout: new THREE.Matrix4(),
    axis: new THREE.Vector3(),
    quaternion: new THREE.Quaternion(),
    point: new THREE.Vector3(),
    cameraDir: new THREE.Vector3(),
    toPlume: new THREE.Vector3(),
    size: new THREE.Vector2()
  },

  init(ctx) {
    this.scene = ctx.scene;
    this.camera = ctx.camera;
    this.renderer = ctx.renderer;

    /* Pad deck height and the tower bearing come from the launch complex, so
     * the ground glow sits on the real deck and the warm light lands on the
     * real tower instead of a guessed offset. */
    const complex = runtime.handles && runtime.handles.launchComplex
      ? runtime.handles.launchComplex : null;
    EX_SPEC.baseY = complex && complex.pad ? complex.pad.deckTopY : 2.6;
    if (complex && complex.tower) {
      this.towerDistance = complex.tower.distance;
      this.towerDirection.set(
        Math.cos(complex.tower.azimuthRad) * complex.tower.distance,
        0,
        Math.sin(complex.tower.azimuthRad) * complex.tower.distance
      ).normalize();
    }

    /* Every flame, plume and shimmer surface is authored in code: additive
     * shader materials, no texture, no model, no post-processing pass. */
    const materialSet = {
      core: exFlameMaterial(EX_SPEC.core),
      glow: exFlameMaterial(EX_SPEC.glow),
      trail: exFlameMaterial(EX_SPEC.trail),
      plumeInner: exColumnMaterial(EX_SPEC.plume.inner, 'inner'),
      plumeOuter: exColumnMaterial(EX_SPEC.plume.outer, 'outer'),
      shimmer: exShimmerMaterial('shell'),
      shimmerFloor: exShimmerMaterial('floor'),
      groundGlow: exGlowMaterial()
    };
    this.materialSet = materialSet;
    this.materials = Object.keys(materialSet).map(function (key) { return materialSet[key]; });

    /* World-space anchor of the effect: the flame instances are placed from
     * the bell anchors' world matrices, while the warm lights and the pad glow
     * are positioned from the published plume base every frame. */
    const group = new THREE.Group();
    group.name = 'exhaust';
    ctx.scene.add(group);
    this.group = group;

    /* Warm engine lights: the cluster, the deck and the tower lattice. */
    const system = this;
    const lightHandles = [];
    ['engine', 'pad', 'tower'].forEach(function (name) {
      const spec = EX_SPEC.lights[name];
      const light = new THREE.PointLight(spec.color, 0, spec.distance, spec.decay);
      light.name = 'exhaust-light-' + name;
      light.castShadow = false;
      group.add(light);
      const entry = { name: name, spec: spec, light: light, intensity: 0 };
      system.lights.push(entry);
      lightHandles.push({
        name: name,
        light: light,
        get intensity() { return entry.intensity; }
      });
    });
    this.lightHandles = lightHandles;

    /* Additive heat glow smeared over the deck under the burning engines. */
    const glowGeometry = new THREE.CircleGeometry(1, 40);
    this.geometries.push(glowGeometry);
    const glow = new THREE.Mesh(glowGeometry, materialSet.groundGlow);
    glow.name = 'exhaust-ground-glow';
    glow.rotation.x = -Math.PI / 2;
    glow.renderOrder = 6;
    glow.frustumCulled = false;
    glow.visible = false;
    group.add(glow);
    this.glow = glow;
    this.glowHandle.mesh = glow;

    /* The plume column lives in world space so its length can stretch towards
     * the pad while its root stays welded to the ascending engine cluster. */
    const plumeGroup = new THREE.Group();
    plumeGroup.name = 'exhaust-plume';
    ctx.scene.add(plumeGroup);
    this.plumeGroup = plumeGroup;

    const plumeSpec = EX_SPEC.plume;
    const plumeInner = new THREE.Mesh(
      exConeGeometry(plumeSpec.inner.topRadius, plumeSpec.inner.bottomRadius, plumeSpec.inner.radial, plumeSpec.inner.rows),
      materialSet.plumeInner
    );
    plumeInner.name = 'exhaust-plume-core';
    plumeInner.renderOrder = 10;
    plumeInner.frustumCulled = false;
    plumeGroup.add(plumeInner);
    this.geometries.push(plumeInner.geometry);

    const plumeOuter = new THREE.Mesh(
      exConeGeometry(plumeSpec.outer.topRadius, plumeSpec.outer.bottomRadius, plumeSpec.outer.radial, plumeSpec.outer.rows),
      materialSet.plumeOuter
    );
    plumeOuter.name = 'exhaust-plume-glow';
    plumeOuter.renderOrder = 5;
    plumeOuter.frustumCulled = false;
    plumeGroup.add(plumeOuter);
    this.geometries.push(plumeOuter.geometry);

    /* Heat shimmer: a veil wrapped around the column plus a shimmering patch
     * of deck where the plume meets the pad. */
    const shimmerGroup = new THREE.Group();
    shimmerGroup.name = 'exhaust-shimmer';
    plumeGroup.add(shimmerGroup);
    this.shimmerGroup = shimmerGroup;
    this.shimmerInfo.group = shimmerGroup;

    const shimmerShell = new THREE.Mesh(exConeGeometry(1.0, 1.08, 18, 34), materialSet.shimmer);
    shimmerShell.name = 'exhaust-shimmer-veil';
    shimmerShell.renderOrder = 14;
    shimmerShell.frustumCulled = false;
    shimmerGroup.add(shimmerShell);
    this.geometries.push(shimmerShell.geometry);

    const shimmerFloor = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), materialSet.shimmerFloor);
    shimmerFloor.name = 'exhaust-shimmer-deck';
    shimmerFloor.rotation.x = -Math.PI / 2;
    shimmerFloor.renderOrder = 13;
    shimmerFloor.frustumCulled = false;
    shimmerFloor.visible = false;
    group.add(shimmerFloor);
    this.geometries.push(shimmerFloor.geometry);
    this.shimmerFloor = shimmerFloor;

    /* Published plume segments, reused in place every frame. */
    for (let i = 0; i < EX_SPEC.segmentCount; i += 1) {
      this.plumeSegments.push({
        index: i,
        t: 0,
        position: new THREE.Vector3(),
        radius: 0,
        length: 0,
        worldY: 0,
        spread: 0,
        active: false
      });
    }

    /* Frame hooks run after every subsystem (including the camera phase) and
     * before the main render, so the veil samples the current frame. */
    this.frameHook = function () { system.captureRefraction(); };
    runtime.onFrame(this.frameHook);

    state.exhaust = state.exhaust || {
      level: 0, throttle: 0, ignition: 0, flameScale: 0, plumeLength: 0,
      plumeWidth: 0, gustRadius: 0, heatRadius: 0, shimmer: 0, segments: 0,
      lights: 0, groundGlow: 0, anchors: 0, attached: false
    };

    exApplyCaptureTier(this, ctx.quality || quality);
    this.attach();
    this.publish(ctx.state || state);

    console.log('[LAUNCH_SCENE] exhaust online - ignition ramp ' + EX_SPEC.ignitionSeconds +
      's, anchors=' + this.anchors.length + ', shimmer=' +
      (this.capture.enabled ? 'refraction' : 'additive'));
  },

  /* Weld the fire to the engine bell anchors published by rocket-rig-handles.
   * Re-runs if the rocket subsystem is replaced, and leaves the fire dark when
   * the rocket is not registered yet. */
  attach() {
    const rocket = runtime.handles && runtime.handles.rocket ? runtime.handles.rocket : null;
    const anchors = rocket && Array.isArray(rocket.engineAnchors) ? rocket.engineAnchors : null;
    if (!anchors || anchors.length === 0) return false;
    if (this.attached && this.rocketHandle === rocket && this.anchors === anchors) return true;
    if (this.attached) this.detachLayers();

    const exitRadius = Number(anchors[0].exitRadius) || this.bellExitRadius;
    this.bellExitRadius = exitRadius;

    const names = ['core', 'glow', 'trail'];
    for (let k = 0; k < names.length; k += 1) {
      const name = names[k];
      const spec = EX_SPEC[name];
      const profile = EX_LAYER_PROFILE[name];
      const tongues = spec.tongues || 1;
      const count = anchors.length * tongues;
      const geometry = exConeGeometry(
        exitRadius * profile.top, exitRadius * profile.bottom, spec.radial, spec.rows
      );
      const lengthAttribute = new THREE.InstancedBufferAttribute(new Float32Array(count), 1);
      const widthAttribute = new THREE.InstancedBufferAttribute(new Float32Array(count), 1);
      const phaseAttribute = new THREE.InstancedBufferAttribute(new Float32Array(count), 1);
      const jitterAttribute = new THREE.InstancedBufferAttribute(new Float32Array(count), 1);
      lengthAttribute.name = 'aLength';
      widthAttribute.name = 'aWidth';
      phaseAttribute.name = 'aPhase';
      jitterAttribute.name = 'aJitter';
      lengthAttribute.setUsage(THREE.DynamicDrawUsage);
      widthAttribute.setUsage(THREE.DynamicDrawUsage);
      geometry.setAttribute('aLength', lengthAttribute);
      geometry.setAttribute('aWidth', widthAttribute);
      geometry.setAttribute('aPhase', phaseAttribute);
      geometry.setAttribute('aJitter', jitterAttribute);

      const mesh = new THREE.InstancedMesh(geometry, this.materialSet[name], count);
      mesh.name = 'exhaust-flame-' + name;
      mesh.renderOrder = spec.order;
      mesh.frustumCulled = false;
      mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      this.group.add(mesh);
      this.geometries.push(geometry);

      const phases = new Float32Array(anchors.length);
      for (let a = 0; a < anchors.length; a += 1) {
        phases[a] = a * 0.41 + k * 0.17;
        for (let t = 0; t < tongues; t += 1) {
          const index = a * tongues + t;
          phaseAttribute.array[index] = phases[a] + t * 1.7;
          jitterAttribute.array[index] = 0.75 + ((index * 37) % 11) / 22;
        }
      }

      this.layers[name] = {
        name: name,
        mesh: mesh,
        count: count,
        tongues: tongues,
        length: lengthAttribute,
        width: widthAttribute,
        phases: phases
      };
    }

    this.anchors = anchors;
    this.rocketHandle = rocket;
    this.attached = true;
    return true;
  },

  /* Drop the flame instances (materials and the plume stay alive). */
  detachLayers() {
    const names = Object.keys(this.layers);
    for (let i = 0; i < names.length; i += 1) {
      const layer = this.layers[names[i]];
      if (this.group) this.group.remove(layer.mesh);
      const geometry = layer.mesh.geometry;
      const index = this.geometries.indexOf(geometry);
      if (index !== -1) this.geometries.splice(index, 1);
      if (geometry && geometry.dispose) geometry.dispose();
    }
    this.layers = {};
    this.anchors = [];
    this.attached = false;
  },

  onQualityChange(qualityTier) {
    exApplyCaptureTier(this, qualityTier);
  },

  /* The single input: the same physical cause the director writes into
   * state.thrust, so a consumer can drive the whole effect stack from here. */
  setThrust(throttle) {
    const value = clamp01(throttle);
    if (runtime.state) runtime.state.thrust = value;
    return value;
  },

  engineAnchor(name) {
    for (let i = 0; i < this.anchors.length; i += 1) {
      if (this.anchors[i].name === name || this.anchors[i].index === Number(name)) return this.anchors[i];
    }
    return null;
  },

  update(dt, shared) {
    const sharedState = shared || runtime.state;
    const delta = Math.max(0, Math.min(0.25, Number(dt) || 0));
    this.clock += delta;
    this.updates += 1;

    if (!this.attached || (runtime.handles && runtime.handles.rocket && this.rocketHandle !== runtime.handles.rocket)) {
      this.attach();
    }

    /* ---- one thrust signal plus the documented ignition ramp ------------ */
    const requested = clamp01(sharedState.thrust);
    this.throttle = requested;
    if (requested > this.level) {
      this.level = Math.min(requested, this.level + delta / EX_SPEC.ignitionSeconds);
    } else if (requested < this.level) {
      this.level += (requested - this.level) * (1 - Math.exp(-delta / EX_SPEC.shutdownTau));
    }
    if (requested > 0.002) {
      this.ignitionTime = Math.min(EX_SPEC.ignitionSeconds, this.ignitionTime + delta);
    } else if (this.level < 0.01) {
      this.ignitionTime = Math.max(0, this.ignitionTime - delta * 1.8);
    }
    this.ignition = clamp01(this.ignitionTime / EX_SPEC.ignitionSeconds);

    const altitude = Math.max(0, Number(sharedState.altitude) || 0);
    const vacuum = clamp01(altitude / EX_SPEC.vacuumAltitude);
    this.vacuum = vacuum;
    this.flameScale = this.level;

    const time = this.clock;
    const names = ['core', 'glow', 'trail'];
    for (let k = 0; k < names.length; k += 1) {
      this.applyFlameLayer(names[k], time, vacuum);
    }
    this.applyPlume(time, altitude);
    this.applyLights(delta, time);
    this.applyShimmer(time);
    this.shimmerInfo.enabled = this.capture.enabled;
    this.shimmerInfo.refracted = this.capture.ready;
    this.publish(sharedState);
  },

  /* One flame layer: stretch, thicken and flicker every instance from the one
   * level value, positioned by the engine bell anchor world matrices. */
  applyFlameLayer(name, time, vacuum) {
    const layer = this.layers[name];
    if (!layer) return;
    const spec = EX_SPEC[name];
    const flick = exFlicker(time, 0, spec.seed);
    const length = spec.length * (0.24 + 0.76 * this.level) * (1 - 0.16 * vacuum) *
      (1 + spec.flicker * (flick - 1));
    const width = spec.width * (0.88 + 0.26 * this.level) * (1 + 0.55 * vacuum) *
      (1 + 0.08 * (flick - 1));

    const material = layer.mesh.material;
    material.uniforms.uTime.value = time;
    material.uniforms.uLevel.value = this.level;

    const lengthValues = layer.length.array;
    const widthValues = layer.width.array;
    const matrix = this.scratch.matrix;
    const offset = this.scratch.offset;
    const layout = this.scratch.layout;
    const quaternion = this.scratch.quaternion;
    const axis = this.scratch.axis;
    let index = 0;
    for (let a = 0; a < this.anchors.length; a += 1) {
      const anchor = this.anchors[a].anchor;
      anchor.updateWorldMatrix(true, false);
      const world = anchor.matrixWorld;
      for (let t = 0; t < layer.tongues; t += 1) {
        const phase = layer.phases[a] + t * 1.7;
        const local = exFlicker(time, phase, spec.seed + t);
        lengthValues[index] = length * (1 + 0.06 * Math.sin(time * 5.7 + phase * 7.0));
        widthValues[index] = width * (0.94 + 0.12 * (local - 1));
        if (t === 0) {
          matrix.copy(world);
        } else {
          const angle = (t / layer.tongues) * Math.PI * 2 + a * 1.1;
          const dx = Math.cos(angle);
          const dz = Math.sin(angle);
          offset.makeTranslation(dx * spec.offset, 0, dz * spec.offset);
          quaternion.setFromAxisAngle(axis.set(dz, 0, -dx).normalize(), -spec.lean);
          layout.makeRotationFromQuaternion(quaternion);
          offset.multiply(layout);
          matrix.multiplyMatrices(world, offset);
        }
        layer.mesh.setMatrixAt(index, matrix);
        index += 1;
      }
    }
    layer.mesh.instanceMatrix.needsUpdate = true;
    layer.length.needsUpdate = true;
    layer.width.needsUpdate = true;

    const published = this.flameLayers[name];
    published.length = length;
    published.width = width;
    published.count = layer.count;
  },

  /* Plume: world position, axis, length and width, all driven by the thrust
   * level and the altitude, plus the published world-space segments. */
  applyPlume(time, altitude) {
    const anchors = this.anchors;
    if (anchors.length === 0) {
      this.plumeLength = 0;
      this.plumeWidth = 0;
      this.gustRadius = 0;
      this.heat.radius = 0;
      this.heat.intensity = 0;
      return;
    }

    const point = this.scratch.point;
    let baseX = 0;
    let baseY = 0;
    let baseZ = 0;
    for (let a = 0; a < anchors.length; a += 1) {
      const anchor = anchors[a].anchor;
      anchor.updateWorldMatrix(true, false);
      point.setFromMatrixPosition(anchor.matrixWorld);
      baseX += point.x;
      baseY += point.y;
      baseZ += point.z;
    }
    this.plumeBase.set(baseX / anchors.length, baseY / anchors.length, baseZ / anchors.length);

    const centre = anchors[0].anchor;
    this.plumeQuaternion.setFromRotationMatrix(centre.matrixWorld);
    this.plumeGroup.position.copy(this.plumeBase);
    this.plumeGroup.quaternion.copy(this.plumeQuaternion);
    this.plumeAxis.set(0, -1, 0).applyQuaternion(this.plumeQuaternion).normalize();

    const plumeLength = exPlumeLength(this.level, this.plumeBase.y);
    const thin = 1 - EX_SPEC.plume.thinAtAltitude * clamp01(altitude / EX_SPEC.plume.altitudeThin);
    const plumeWidth = EX_SPEC.plume.radius * (0.72 + 0.34 * this.level) * thin;
    this.plumeLength = plumeLength;
    this.plumeWidth = plumeWidth;

    const inner = this.materialSet.plumeInner.uniforms;
    inner.uTime.value = time;
    inner.uLevel.value = this.level;
    inner.uLength.value = plumeLength;
    inner.uWidth.value = plumeWidth * 0.78;
    inner.uReps.value = Math.min(40, Math.max(3, plumeLength / 12));

    const outer = this.materialSet.plumeOuter.uniforms;
    outer.uTime.value = time;
    outer.uLevel.value = this.level;
    outer.uLength.value = plumeLength * 0.97;
    outer.uWidth.value = plumeWidth;
    outer.uReps.value = Math.min(34, Math.max(3, plumeLength / 15));

    const visible = this.level > 0.01;
    const shimmerGroup = this.shimmerGroup;
    this.plumeGroup.children.forEach(function (child) {
      if (child !== shimmerGroup) child.visible = visible;
    });

    /* Published world-space segments: smoke, dust and the reactive phases
     * place their spawns straight from these instead of re-deriving a plume. */
    const segments = this.plumeSegments;
    const span = Math.max(1, segments.length - 1);
    for (let i = 0; i < segments.length; i += 1) {
      const t = i / span;
      const segment = segments[i];
      segment.t = t;
      segment.position.copy(this.plumeBase).addScaledVector(this.plumeAxis, t * plumeLength);
      segment.radius = plumeWidth * (0.55 + 0.75 * t) * (1 - 0.35 * t * t);
      segment.length = plumeLength / span;
      segment.worldY = segment.position.y;
      segment.spread = segment.radius * (0.35 + 0.65 * t);
      segment.active = visible;
    }

    this.deckWarmth = clamp01(1 - Math.max(0, this.plumeBase.y - EX_SPEC.baseY) / EX_SPEC.groundGlow.altitudeFade);
    this.gustRadius = this.level * (
      EX_SPEC.gust.base +
      this.level * EX_SPEC.gust.thrust +
      clamp01(altitude / EX_SPEC.gust.altitudeScale) * EX_SPEC.gust.altitude
    );
    this.heat.radius = plumeWidth * 2.6 + this.level * 4;
    this.heat.intensity = this.level * (0.35 + 0.65 * this.deckWarmth);
  },

  /* Warm thrust-driven lights plus the additive ground glow on the deck. */
  applyLights(delta, time) {
    const flick = exFlicker(time, 0.5, 3.1);
    for (let i = 0; i < this.lights.length; i += 1) {
      const entry = this.lights[i];
      let target = 0;
      if (entry.name === 'engine') {
        entry.light.position.copy(this.plumeBase).addScaledVector(this.plumeAxis, -1.25);
        target = entry.spec.peak * this.level * (0.9 + 0.2 * flick);
      } else if (entry.name === 'pad') {
        entry.light.position.set(this.plumeBase.x, EX_SPEC.baseY + 2.2, this.plumeBase.z);
        target = entry.spec.peak * this.level * this.deckWarmth;
      } else {
        const offset = Math.min(7, this.towerDistance * 0.4);
        entry.light.position.set(
          this.plumeBase.x + this.towerDirection.x * offset,
          Math.max(EX_SPEC.baseY + 1, this.plumeBase.y - this.plumeLength * 0.35),
          this.plumeBase.z + this.towerDirection.z * offset
        );
        target = entry.spec.peak * this.level * (0.30 + 0.70 * this.deckWarmth);
      }
      const k = Math.min(1, 1 - Math.exp(-delta / entry.spec.tau));
      entry.intensity += (target - entry.intensity) * k;
      entry.light.intensity = entry.intensity;
      entry.light.visible = entry.intensity > 0.05;
    }

    this.groundGlowRadius = EX_SPEC.groundGlow.radius + this.level * EX_SPEC.groundGlow.peakRadius;
    this.groundGlowIntensity = EX_SPEC.groundGlow.peak * this.level * this.deckWarmth;
    const glow = this.glow;
    if (glow) {
      glow.visible = this.groundGlowIntensity > 0.008;
      glow.position.set(this.plumeBase.x, EX_SPEC.baseY + 0.14, this.plumeBase.z);
      glow.scale.set(this.groundGlowRadius, this.groundGlowRadius, 1);
      const uniforms = this.materialSet.groundGlow.uniforms;
      uniforms.uTime.value = time;
      uniforms.uIntensity.value = this.groundGlowIntensity * (1 + 0.12 * (flick - 1));
    }
    this.glowHandle.intensity = this.groundGlowIntensity;
    this.glowHandle.radius = this.groundGlowRadius;
  },

  /* Heat shimmer: the veil tracks the plume, the deck patch follows the pad. */
  applyShimmer(time) {
    const heat = this.level * (0.35 + 0.65 * clamp01(this.plumeLength / 70 + 0.3));
    this.shimmerInfo.intensity = heat;
    const veil = this.materialSet.shimmer.uniforms;
    veil.uTime.value = time;
    veil.uHeat.value = heat;
    veil.uLength.value = this.plumeLength * 0.94;
    veil.uWidth.value = Math.max(0.5, this.plumeWidth * EX_SPEC.shimmer.radiusScale);
    this.shimmerGroup.visible = heat > 0.01;

    const floor = this.materialSet.shimmerFloor.uniforms;
    const floorHeat = this.level * this.deckWarmth;
    floor.uTime.value = time;
    floor.uHeat.value = floorHeat;
    floor.uWidth.value = EX_SPEC.shimmer.floorRadius * (0.6 + 0.4 * this.level);
    if (this.shimmerFloor) {
      this.shimmerFloor.visible = floorHeat > 0.01;
      this.shimmerFloor.position.set(this.plumeBase.x, EX_SPEC.baseY + 0.22, this.plumeBase.z);
    }
  },

  /* Cheap "is the plume worth refracting" test for the capture pass. */
  plumeVisibility() {
    const camera = this.camera;
    if (!camera) return 0;
    const direction = this.scratch.cameraDir;
    camera.getWorldDirection(direction);
    const toPlume = this.scratch.toPlume.copy(this.plumeBase).sub(camera.position);
    const distance = Math.max(1, toPlume.length());
    toPlume.multiplyScalar(1 / distance);
    const radius = Math.max(this.plumeWidth * 2.5, this.plumeLength * 0.25);
    const facing = direction.dot(toPlume);
    return clamp01((facing + 0.15 - radius / distance) * 3.5);
  },

  /* Small refraction target, reused across frames, rebuilt on resize or when
   * the quality tier changes its resolution scale. */
  ensureRefractionTarget(scale) {
    const renderer = this.renderer;
    if (!renderer) return null;
    const size = renderer.getDrawingBufferSize(this.scratch.size);
    const width = Math.max(16, Math.floor(size.x * scale));
    const height = Math.max(16, Math.floor(size.y * scale));
    const target = this.capture.target;
    if (target && target.width === width && target.height === height) return target;
    if (target) target.dispose();
    const next = new THREE.WebGLRenderTarget(width, height, {
      minFilter: THREE.LinearFilter,
      magFilter: THREE.LinearFilter,
      depthBuffer: true,
      stencilBuffer: false,
      generateMipmaps: false
    });
    next.texture.name = 'exhaust-heat-refraction';
    this.capture.target = next;
    this.capture.ready = false;
    this.materialSet.shimmer.uniforms.uScene.value = next.texture;
    this.materialSet.shimmerFloor.uniforms.uScene.value = next.texture;
    return next;
  },

  /* Run from a frame hook (after the camera phase, before the main render):
   * draw the frame into a small linear target, then hand it to the shimmer
   * veil, which samples it through a warped screen UV. Any failure falls back
   * to the additive veil for good instead of spamming the error log. */
  captureRefraction() {
    const capture = this.capture;
    if (!capture.enabled || capture.disabled) return false;
    const renderer = this.renderer;
    if (!renderer || !this.scene || !this.camera) return false;
    if (this.level < 0.02) return false;
    capture.frame += 1;
    if (capture.stride > 1 && capture.frame % capture.stride !== 0) return false;
    if (this.plumeVisibility() < 0.05) return false;

    const target = this.ensureRefractionTarget(capture.scale);
    if (!target) return false;
    /* Both shimmer surfaces sample the target's texture, so they must be out
     * of the pass: sampling a bound colour attachment is invalid in WebGL. */
    const veil = this.shimmerGroup;
    const floor = this.shimmerFloor;
    const veilWasVisible = veil.visible;
    const floorWasVisible = floor ? floor.visible : false;
    const shadowAuto = renderer.shadowMap.autoUpdate;
    const restore = function () {
      veil.visible = veilWasVisible;
      if (floor) floor.visible = floorWasVisible;
      renderer.shadowMap.autoUpdate = shadowAuto;
      renderer.setRenderTarget(null);
    };
    try {
      veil.visible = false;
      if (floor) floor.visible = false;
      renderer.shadowMap.autoUpdate = false;   // the shadow maps were drawn this frame
      renderer.setRenderTarget(target);
      renderer.render(this.scene, this.camera);
      restore();
      capture.ready = true;
      this.materialSet.shimmer.uniforms.uHasScene.value = 1;
      this.materialSet.shimmerFloor.uniforms.uHasScene.value = 1;
      return true;
    } catch (error) {
      capture.disabled = true;
      capture.enabled = false;
      capture.ready = false;
      restore();
      this.materialSet.shimmer.uniforms.uHasScene.value = 0;
      this.materialSet.shimmerFloor.uniforms.uHasScene.value = 0;
      console.warn('[LAUNCH_SCENE] exhaust heat shimmer refraction unavailable, using additive veil:', error);
      return false;
    }
  },

  /* Mirror the derived numbers into the shared state for phases that only read
   * state and never the api object. */
  publish(sharedState) {
    const target = sharedState && sharedState.exhaust ? sharedState.exhaust : null;
    if (!target) return;
    target.level = Number(this.level.toFixed(4));
    target.throttle = Number(this.throttle.toFixed(4));
    target.ignition = Number(this.ignition.toFixed(4));
    target.flameScale = Number(this.flameScale.toFixed(4));
    target.plumeLength = Number(this.plumeLength.toFixed(3));
    target.plumeWidth = Number(this.plumeWidth.toFixed(3));
    target.gustRadius = Number(this.gustRadius.toFixed(3));
    target.heatRadius = Number(this.heat.radius.toFixed(3));
    target.shimmer = Number(this.shimmerInfo.intensity.toFixed(4));
    target.segments = this.plumeSegments.length;
    target.lights = Number((this.lights.length ? this.lights[0].intensity : 0).toFixed(3));
    target.groundGlow = Number(this.groundGlowIntensity.toFixed(4));
    target.anchors = this.anchors.length;
    target.attached = this.attached;
  },

  getState() {
    const base = this.plumeBase;
    const axis = this.plumeAxis;
    return {
      registered: runtime.has('flames'),
      attached: this.attached,
      anchors: this.anchors.length,
      bellExitRadius: this.bellExitRadius,
      ignitionSeconds: EX_SPEC.ignitionSeconds,
      throttle: Number(this.throttle.toFixed(4)),
      thrust: Number(this.level.toFixed(4)),
      level: Number(this.level.toFixed(4)),
      ignition: Number(this.ignition.toFixed(4)),
      flameScale: Number(this.flameScale.toFixed(4)),
      flameLayers: {
        core: { length: Number(this.flameLayers.core.length.toFixed(3)), width: Number(this.flameLayers.core.width.toFixed(3)), count: this.flameLayers.core.count },
        glow: { length: Number(this.flameLayers.glow.length.toFixed(3)), width: Number(this.flameLayers.glow.width.toFixed(3)), count: this.flameLayers.glow.count },
        trail: { length: Number(this.flameLayers.trail.length.toFixed(3)), width: Number(this.flameLayers.trail.width.toFixed(3)), count: this.flameLayers.trail.count }
      },
      plume: {
        base: { x: Number(base.x.toFixed(3)), y: Number(base.y.toFixed(3)), z: Number(base.z.toFixed(3)) },
        axis: { x: Number(axis.x.toFixed(4)), y: Number(axis.y.toFixed(4)), z: Number(axis.z.toFixed(4)) },
        length: Number(this.plumeLength.toFixed(3)),
        width: Number(this.plumeWidth.toFixed(3)),
        segments: this.plumeSegments.length,
        tipY: Number((base.y - this.plumeLength).toFixed(3)),
        gustRadius: Number(this.gustRadius.toFixed(3)),
        heatRadius: Number(this.heat.radius.toFixed(3)),
        heatIntensity: Number(this.heat.intensity.toFixed(4)),
        deckWarmth: Number(this.deckWarmth.toFixed(3))
      },
      lights: this.lights.map(function (entry) {
        return {
          name: entry.name,
          intensity: Number(entry.intensity.toFixed(3)),
          x: Number(entry.light.position.x.toFixed(3)),
          y: Number(entry.light.position.y.toFixed(3)),
          z: Number(entry.light.position.z.toFixed(3))
        };
      }),
      groundGlow: { intensity: Number(this.groundGlowIntensity.toFixed(4)), radius: Number(this.groundGlowRadius.toFixed(3)) },
      shimmer: {
        enabled: this.capture.enabled,
        refracted: this.capture.ready,
        intensity: Number(this.shimmerInfo.intensity.toFixed(4)),
        amp: EX_SPEC.shimmer.amp
      },
      time: Number(this.clock.toFixed(3)),
      frames: this.updates,
      errors: runtime.state.errors.length
    };
  },

  dispose(ctx) {
    if (this.frameHook) runtime.offFrame(this.frameHook);
    this.frameHook = null;
    if (this.capture.target) {
      this.capture.target.dispose();
      this.capture.target = null;
    }
    this.capture.ready = false;
    if (ctx && ctx.scene) {
      if (this.group) ctx.scene.remove(this.group);
      if (this.plumeGroup) ctx.scene.remove(this.plumeGroup);
    }
    exDisposeList(this.geometries);
    exDisposeList(this.materials);
    this.layers = {};
    this.lights = [];
    this.lightHandles = [];
    this.anchors = [];
    this.rocketHandle = null;
    this.attached = false;
    this.materialSet = null;
    this.group = null;
    this.plumeGroup = null;
    this.shimmerGroup = null;
    this.shimmerFloor = null;
    this.glow = null;
    this.throttle = 0;
    this.level = 0;
    this.ignition = 0;
    this.ignitionTime = 0;
    this.plumeLength = 0;
    this.plumeWidth = 0;
    this.gustRadius = 0;
    this.shimmerInfo = { group: null, intensity: 0, enabled: false, refracted: false };
    this.glowHandle = { mesh: null, intensity: 0, radius: 0 };
    if (runtime.state) runtime.state.exhaust = null;
    if (runtime.exhaust === this.api) runtime.exhaust = null;
    this.api = null;
  }
};

/* The interface published as LAUNCH_SCENE.exhaust: every visual field is a
 * live read-only getter, and setThrust() is the single input. */
function exCreateApi(system) {
  return {
    version: '1.0.0-exhaust',
    subsystem: 'flames',
    ignitionSeconds: EX_SPEC.ignitionSeconds,
    setThrust: function (throttle) { return system.setThrust(throttle); },
    engineAnchor: function (name) { return system.engineAnchor(name); },
    getState: function () { return system.getState(); },
    get attached() { return system.attached; },
    get anchors() { return system.anchors; },
    get anchorCount() { return system.anchors.length; },
    get bellExitRadius() { return system.bellExitRadius; },
    get throttle() { return system.throttle; },
    get thrust() { return system.level; },
    get level() { return system.level; },
    get ignition() { return system.ignition; },
    get flameScale() { return system.flameScale; },
    get flameLayers() { return system.flameLayers; },
    get plumeBase() { return system.plumeBase; },
    get plumeAxis() { return system.plumeAxis; },
    get plumeLength() { return system.plumeLength; },
    get plumeWidth() { return system.plumeWidth; },
    get plumeSegments() { return system.plumeSegments; },
    get gustRadius() { return system.gustRadius; },
    get heat() { return system.heat; },
    get shimmer() { return system.shimmerInfo; },
    get lights() { return system.lightHandles; },
    get groundGlow() { return system.glowHandle; }
  };
}

exhaustSystem.api = exCreateApi(exhaustSystem);
runtime.exhaust = exhaustSystem.api;
runtime.register('flames', exhaustSystem);

/* ============================================================================
 * SECTION: particles - the launch atmosphere: thick rolling smoke, a ground
 * dust wall, the bright plume trail, sparks, embers, motes and debris.
 * ----------------------------------------------------------------------------
 * Everything below is emitted from the exhaust signal, never from a private
 * timeline. LAUNCH_SCENE.exhaust publishes the ramped thrust level, the flame
 * scale, the world-space plume (base, axis, length, width and the sampled
 * world segments), the gust radius and the near-field heat; this section
 * samples exactly those numbers every frame and converts them into emission
 * rates, spawn positions, velocities, spread radius and trail length. Smoke,
 * dust and trail therefore always stay causally tied to the flames, and the
 * pad keeps belching smoke and dust while the vehicle climbs because the
 * driver is the thrust level, not the vehicle position.
 *
 * SEVEN RECYCLED POOLS (InstancedMesh billboards, one shader, no churn)
 *   smoke   thick pad smoke: rolls, expands, swirls and rises
 *   dust    the ground dust wall: hugs the terrain sampler, spreads outward
 *   trail   the bright plume trail: welded to the engine bay, long at altitude
 *   spark   additive sparks thrown off the flame and off the pad
 *   ember   glowing embers guttering inside the smoke cloud
 *   mote    small dust motes drifting through the gust field
 *   debris  exhaust fragments tumbling out of the flame trench
 * Every pool is pre-allocated once at the high-tier capacity; a live budget
 * scales the active limit and the emission rates per quality tier, dead
 * instances are recycled by a swap-remove, and the per-frame path allocates
 * nothing at all: positions, sizes, rolls, alphas and tints are written into
 * pre-allocated InstancedBufferAttributes.
 *
 * MOTION - one shared curl field, no per-particle script
 *   The roll, swirl and rise come from the curl of an analytic potential that
 *   every puff samples at its own position (offset by its own seed), plus a
 *   thrust-scaled gust push out of the plume, buoyancy and drag. Ground dust
 *   is clamped to the terrain sampler published by the world phase, sparks and
 *   debris bounce and skitter on the deck, apron and trench floor, and the
 *   trail is built from LAUNCH_SCENE.exhaust.plumeSegments so it stretches
 *   with the plume and stays attached to the engine bells.
 *
 * TEXTURES - canvas only, never an image URL: procedural puff, dust, plume,
 * spark, ember and chip sprites are painted at load time and tinted per
 * instance, so the CDN host allowlist stays CDN-only.
 *
 * PUBLISHED API - LAUNCH_SCENE.smoke (registered as the 'smoke' subsystem)
 *   pools           { name -> live pool } for the whole particle stack
 *   getState()      numbers-only snapshot: per-pool active counts, limits,
 *                   capacities, emitted totals, the ground dust radius, the
 *                   trail length, the gust radius, thrust, altitude, frames
 *   active(name)    live instance count of one pool
 *   live / capacity totals across the pools
 *   dustRadius      metres of ground dust footprint currently spread
 *   trailLength     metres of bright trail currently emitted
 *   getState() is what the verification console samples: counts stay bounded
 *   by the pool limit over an arbitrarily long run and never fall to zero
 *   while the engines are lit.
 * ----------------------------------------------------------------------------
 */

/* ---------------------------------------------------------------------------
 * Shared helpers: one potential field, one curl, one instance write
 * ------------------------------------------------------------------------ */

function psRange(random, pair) {
  return pair[0] + random() * (pair[1] - pair[0]);
}

/* Analytic potential: smooth, deterministic, allocation free. */
function psPotential(x, y, z, t) {
  return Math.sin(x * 0.62 + y * 0.41 + t * 0.35) * 0.50
    + Math.sin(y * 0.83 - z * 0.57 + t * 0.21) * 0.32
    + Math.sin(z * 1.21 + x * 0.36 - t * 0.45) * 0.22
    + Math.sin((x + y + z) * 0.29 + t * 0.13) * 0.16;
}

/* Curl of that potential by central differences; writes x, y, z into out.
 * This is the whole of the "roll, swirl and rise": a puff that drifts through
 * the field is stirred by the field, not by a private animation. */
function psCurl(x, y, z, t, out) {
  const e = PS_SPEC.curl.epsilon;
  const dy = psPotential(x, y + e, z, t) - psPotential(x, y - e, z, t);
  const dz = psPotential(x, y, z + e, t) - psPotential(x, y, z - e, t);
  const dx = psPotential(x + e, y, z, t) - psPotential(x - e, y, z, t);
  out[0] = (dy - dz) / (2 * e);
  out[1] = (dz - dx) / (2 * e);
  out[2] = (dx - dy) / (2 * e);
}

/* Late-bound terrain sampler: the world phase publishes terrainHeight(x, z)
 * through LAUNCH_SCENE.collections, and the ground dust wall is clamped to it
 * so the dust rolls along the ground instead of floating over it. */
function psTerrain(system, x, z) {
  let sampler = system.terrain;
  if (!sampler) {
    const collections = runtime.collections;
    if (collections && typeof collections.terrainHeight === 'function') {
      sampler = collections.terrainHeight;
      system.terrain = sampler;
    }
  }
  return sampler ? sampler(x, z) : 0;
}

/* Surface under a point: deck plate on the pad, trench floor inside the flame
 * corridor, apron on the blast apron, terrain everywhere else. */
function psSurfaceY(system, x, z) {
  const pad = system.pad;
  const dx = x - pad.x;
  const dz = z - pad.z;
  const d2 = dx * dx + dz * dz;
  const along = pad.trenchSign * dx;
  if (Math.abs(dz) <= pad.trenchHalfWidth && along > pad.holeRadius && along < pad.trenchMouth) {
    return pad.trenchFloorY;
  }
  if (d2 <= pad.deckSq) return pad.deckY;
  if (d2 <= pad.apronSq) return pad.apronY;
  return psTerrain(system, x, z);
}

/* ---------------------------------------------------------------------------
 * Procedural canvas sprites (never an image URL)
 * ------------------------------------------------------------------------ */

function psPuffTexture(kind, seed) {
  const dusty = kind === 'dust';
  return makeCanvasTexture(256, 256, 256, function (context, width, height) {
    const random = seededRandom(seed);
    const centre = width * 0.5;
    const core = context.createRadialGradient(centre, centre, 0, centre, centre, centre);
    core.addColorStop(0.00, 'rgba(255,255,255,0.98)');
    core.addColorStop(0.30, 'rgba(252,253,255,0.88)');
    core.addColorStop(0.60, 'rgba(246,249,252,0.44)');
    core.addColorStop(0.84, 'rgba(240,246,250,0.13)');
    core.addColorStop(1.00, 'rgba(236,244,250,0)');
    context.fillStyle = core;
    context.fillRect(0, 0, width, height);

    /* Billowy lobes break the disc silhouette. */
    context.globalCompositeOperation = 'lighter';
    const lobes = 26;
    for (let i = 0; i < lobes; i += 1) {
      const angle = random() * PS_TAU;
      const distance = random() * centre * 0.6;
      const x = centre + Math.cos(angle) * distance;
      const y = centre + Math.sin(angle) * distance * 0.82;
      const radius = width * (0.10 + random() * 0.17);
      const lobe = context.createRadialGradient(x, y, 0, x, y, radius);
      lobe.addColorStop(0, 'rgba(255,255,255,0.52)');
      lobe.addColorStop(0.6, 'rgba(252,254,255,0.20)');
      lobe.addColorStop(1, 'rgba(248,252,255,0)');
      context.fillStyle = lobe;
      context.beginPath();
      context.arc(x, y, radius, 0, PS_TAU);
      context.fill();
    }

    /* Internal structure: the roll of a puff reads because the sprite itself
     * carries scrolled density, not because the disc is uniform. */
    for (let i = 0; i < 34; i += 1) {
      const x = centre + (random() - 0.5) * width * 0.74;
      const y = centre + (random() - 0.5) * height * 0.74;
      const radius = width * (0.05 + random() * 0.15);
      const light = random() > (dusty ? 0.55 : 0.45);
      const patch = context.createRadialGradient(x, y, 0, x, y, radius);
      patch.addColorStop(0, light ? 'rgba(255,255,255,0.30)' : 'rgba(92,98,108,0.26)');
      patch.addColorStop(1, 'rgba(255,255,255,0)');
      context.fillStyle = patch;
      context.beginPath();
      context.arc(x, y, radius, 0, PS_TAU);
      context.fill();
    }

    /* Trim everything back inside the soft silhouette, then shade the base of
     * the puff so a lit top and a cooler underside read at a glance. */
    context.globalCompositeOperation = 'destination-in';
    context.fillStyle = core;
    context.fillRect(0, 0, width, height);
    context.globalCompositeOperation = 'source-atop';
    const shade = context.createLinearGradient(0, 0, 0, height);
    shade.addColorStop(0, 'rgba(255,255,255,0)');
    shade.addColorStop(0.62, dusty ? 'rgba(120,100,72,0.10)' : 'rgba(186,198,212,0.12)');
    shade.addColorStop(1, dusty ? 'rgba(108,88,60,0.34)' : 'rgba(150,166,186,0.34)');
    context.fillStyle = shade;
    context.fillRect(0, 0, width, height);
    context.globalCompositeOperation = 'source-over';
  });
}

function psSparkTexture() {
  return makeCanvasTexture(64, 64, 64, function (context, width, height) {
    const centre = width * 0.5;
    const glow = context.createRadialGradient(centre, centre, 0, centre, centre, centre);
    glow.addColorStop(0.00, 'rgba(255,255,255,1)');
    glow.addColorStop(0.16, 'rgba(255,244,206,0.94)');
    glow.addColorStop(0.42, 'rgba(255,178,84,0.32)');
    glow.addColorStop(1.00, 'rgba(255,132,32,0)');
    context.fillStyle = glow;
    context.fillRect(0, 0, width, height);
  });
}

function psEmberTexture() {
  return makeCanvasTexture(64, 64, 64, function (context, width, height) {
    const random = seededRandom(90214);
    const centre = width * 0.5;
    const core = context.createRadialGradient(centre, centre, 0, centre, centre, centre * 0.92);
    core.addColorStop(0.00, 'rgba(255,246,222,1)');
    core.addColorStop(0.26, 'rgba(255,206,124,0.92)');
    core.addColorStop(0.62, 'rgba(255,140,42,0.44)');
    core.addColorStop(1.00, 'rgba(214,78,10,0)');
    context.fillStyle = core;
    context.fillRect(0, 0, width, height);
    /* Lumpy coal edge: a few hot patches clipped back inside the glow. */
    context.globalCompositeOperation = 'source-atop';
    for (let i = 0; i < 9; i += 1) {
      const angle = random() * PS_TAU;
      const distance = random() * centre * 0.55;
      const x = centre + Math.cos(angle) * distance;
      const y = centre + Math.sin(angle) * distance;
      const radius = width * (0.06 + random() * 0.12);
      const patch = context.createRadialGradient(x, y, 0, x, y, radius);
      patch.addColorStop(0, 'rgba(255,236,196,0.55)');
      patch.addColorStop(1, 'rgba(255,150,60,0)');
      context.fillStyle = patch;
      context.beginPath();
      context.arc(x, y, radius, 0, PS_TAU);
      context.fill();
    }
    context.globalCompositeOperation = 'source-over';
  });
}

/* Exhaust fragment: a small angular chip with a hot rim, so debris reads as
 * incandescent metal and insulation rather than as a dot. */
function psChipTexture() {
  return makeCanvasTexture(64, 64, 64, function (context, width, height) {
    const random = seededRandom(90215);
    const centre = width * 0.5;
    context.clearRect(0, 0, width, height);
    context.beginPath();
    const sides = 5;
    for (let i = 0; i < sides; i += 1) {
      const angle = (i / sides) * PS_TAU + 0.4;
      const radius = width * (0.20 + random() * 0.16);
      const x = centre + Math.cos(angle) * radius;
      const y = centre + Math.sin(angle) * radius;
      if (i === 0) context.moveTo(x, y);
      else context.lineTo(x, y);
    }
    context.closePath();
    const body = context.createLinearGradient(centre - 16, centre - 16, centre + 16, centre + 16);
    body.addColorStop(0.0, 'rgba(255,232,190,0.98)');
    body.addColorStop(0.5, 'rgba(180,146,108,0.96)');
    body.addColorStop(1.0, 'rgba(72,62,54,0.94)');
    context.fillStyle = body;
    context.fill();
    context.globalCompositeOperation = 'source-atop';
    context.strokeStyle = 'rgba(255,246,222,0.85)';
    context.lineWidth = 2.4;
    context.stroke();
    context.globalCompositeOperation = 'source-over';
  });
}

function psCreateTextures() {
  const textures = {
    smoke: psPuffTexture('smoke', 90210),
    dust: psPuffTexture('dust', 90211),
    plume: psPuffTexture('plume', 90212),
    spark: psSparkTexture(),
    ember: psEmberTexture(),
    chip: psChipTexture()
  };
  /* Sprites must not bleed across their own edge. */
  const names = Object.keys(textures);
  for (let i = 0; i < names.length; i += 1) {
    const texture = textures[names[i]];
    texture.wrapS = THREE.ClampToEdgeWrapping;
    texture.wrapT = THREE.ClampToEdgeWrapping;
  }
  return textures;
}

/* ---------------------------------------------------------------------------
 * Billboard shader: one quad per instance, screen aligned, rotated by its own
 * roll, faded with its own alpha, fogged against the scene fog so the far end
 * of a high trail sinks into the same haze as the sky.
 * ------------------------------------------------------------------------ */

const PS_BILLBOARD_VERT = [
  'attribute vec3 aOffset;',
  'attribute vec2 aSize;',
  'attribute float aRoll;',
  'attribute float aAlpha;',
  'attribute vec3 aTint;',
  'varying vec2 vUv;',
  'varying vec4 vColour;',
  'varying float vFogDepth;',
  'void main() {',
  '  float c = cos(aRoll);',
  '  float s = sin(aRoll);',
  '  vec2 corner = position.xy;',
  '  vec2 spun = vec2(corner.x * c - corner.y * s, corner.x * s + corner.y * c);',
  '  vec4 mv = modelViewMatrix * vec4(aOffset, 1.0);',
  '  mv.xy += spun * aSize;',
  '  vFogDepth = -mv.z;',
  '  vUv = uv;',
  '  vColour = vec4(aTint, aAlpha);',
  '  gl_Position = projectionMatrix * mv;',
  '}'
].join('\n');

const PS_BILLBOARD_FRAG = [
  'uniform sampler2D uMap;',
  'uniform vec3 uFogColour;',
  'uniform float uFogNear;',
  'uniform float uFogFar;',
  'uniform float uOpacity;',
  'uniform float uAdditive;',
  'varying vec2 vUv;',
  'varying vec4 vColour;',
  'varying float vFogDepth;',
  'void main() {',
  '  vec4 texel = texture2D(uMap, vUv);',
  '  float alpha = texel.a * vColour.a * uOpacity;',
  '  if (alpha < 0.004) discard;',
  '  vec3 colour = texel.rgb * vColour.rgb;',
  '  float fog = smoothstep(uFogNear, uFogFar, vFogDepth);',
  '  if (uAdditive > 0.5) {',
  '    gl_FragColor = vec4(colour, alpha * (1.0 - fog));',
  '  } else {',
  '    gl_FragColor = vec4(mix(colour, uFogColour, fog), alpha * (1.0 - fog * 0.7));',
  '  }',
  EX_OUTPUT_GLSL,
  '}'
].join('\n');

function psBillboardMaterial(name, spec, map) {
  return new THREE.ShaderMaterial({
    name: 'particles-' + name,
    uniforms: {
      uMap: { value: map },
      uOpacity: { value: spec.alpha },
      uAdditive: { value: spec.additive ? 1 : 0 },
      uFogColour: { value: new THREE.Color(0xd8ecff) },
      uFogNear: { value: 900 },
      uFogFar: { value: 5200 }
    },
    vertexShader: PS_BILLBOARD_VERT,
    fragmentShader: PS_BILLBOARD_FRAG,
    transparent: true,
    blending: spec.additive ? THREE.AdditiveBlending : THREE.NormalBlending,
    depthWrite: false,
    depthTest: true,
    side: THREE.DoubleSide,
    fog: false
  });
}

/* ---------------------------------------------------------------------------
 * Pool construction, reservation and recycling
 * ------------------------------------------------------------------------ */

function psCreatePool(name, spec, textures) {
  const capacity = spec.capacity;
  const geometry = new THREE.PlaneGeometry(1, 1);
  const attributes = {
    aOffset: new THREE.InstancedBufferAttribute(new Float32Array(capacity * 3), 3),
    aSize: new THREE.InstancedBufferAttribute(new Float32Array(capacity * 2), 2),
    aRoll: new THREE.InstancedBufferAttribute(new Float32Array(capacity), 1),
    aAlpha: new THREE.InstancedBufferAttribute(new Float32Array(capacity), 1),
    aTint: new THREE.InstancedBufferAttribute(new Float32Array(capacity * 3), 3)
  };
  const names = Object.keys(attributes);
  for (let i = 0; i < names.length; i += 1) {
    attributes[names[i]].setUsage(THREE.DynamicDrawUsage);
    geometry.setAttribute(names[i], attributes[names[i]]);
  }

  const material = psBillboardMaterial(name, spec, textures[spec.texture]);
  const mesh = new THREE.InstancedMesh(geometry, material, capacity);
  mesh.name = 'particles-' + name;
  mesh.count = 0;                    // nothing is drawn until the emiters fill it
  mesh.frustumCulled = false;        // positions live in world space in the shader
  mesh.renderOrder = spec.renderOrder;
  mesh.matrixAutoUpdate = false;
  mesh.updateMatrix();

  return {
    name: name,
    spec: spec,
    mesh: mesh,
    geometry: geometry,
    material: material,
    attributes: attributes,
    capacity: capacity,
    limit: capacity,
    active: 0,
    emitted: 0,
    acc: 0,
    burst: 0,
    curlStrength: spec.curl,
    coolR: spec.tintCool[0],
    coolG: spec.tintCool[1],
    coolB: spec.tintCool[2],
    /* Attribute arrays (shared with the geometry) ... */
    pos: attributes.aOffset.array,
    size: attributes.aSize.array,
    roll: attributes.aRoll.array,
    alpha: attributes.aAlpha.array,
    tint: attributes.aTint.array,
    /* ... plus the simulation arrays, one entry per pre-allocated instance. */
    vel: new Float32Array(capacity * 3),
    tintA: new Float32Array(capacity * 3),
    base: new Float32Array(capacity),
    aspect: new Float32Array(capacity),
    spin: new Float32Array(capacity),
    growK: new Float32Array(capacity),
    drag: new Float32Array(capacity),
    rise: new Float32Array(capacity),
    seed: new Float32Array(capacity),
    age: new Float32Array(capacity),
    life: new Float32Array(capacity),
    peak: new Float32Array(capacity),
    ground: new Float32Array(capacity),
    bounce: new Uint8Array(capacity)
  };
}

/* Copy one instance slot over another (used by the swap-remove below). */
function psCopyInstance(pool, from, to) {
  if (from === to) return;
  const f3 = from * 3;
  const t3 = to * 3;
  pool.pos[t3] = pool.pos[f3];
  pool.pos[t3 + 1] = pool.pos[f3 + 1];
  pool.pos[t3 + 2] = pool.pos[f3 + 2];
  pool.vel[t3] = pool.vel[f3];
  pool.vel[t3 + 1] = pool.vel[f3 + 1];
  pool.vel[t3 + 2] = pool.vel[f3 + 2];
  pool.tint[t3] = pool.tint[f3];
  pool.tint[t3 + 1] = pool.tint[f3 + 1];
  pool.tint[t3 + 2] = pool.tint[f3 + 2];
  pool.tintA[t3] = pool.tintA[f3];
  pool.tintA[t3 + 1] = pool.tintA[f3 + 1];
  pool.tintA[t3 + 2] = pool.tintA[f3 + 2];
  pool.size[to * 2] = pool.size[from * 2];
  pool.size[to * 2 + 1] = pool.size[from * 2 + 1];
  pool.roll[to] = pool.roll[from];
  pool.alpha[to] = pool.alpha[from];
  pool.base[to] = pool.base[from];
  pool.aspect[to] = pool.aspect[from];
  pool.spin[to] = pool.spin[from];
  pool.growK[to] = pool.growK[from];
  pool.drag[to] = pool.drag[from];
  pool.rise[to] = pool.rise[from];
  pool.seed[to] = pool.seed[from];
  pool.age[to] = pool.age[from];
  pool.life[to] = pool.life[from];
  pool.peak[to] = pool.peak[from];
  pool.ground[to] = pool.ground[from];
  pool.bounce[to] = pool.bounce[from];
}

/* Reserve one instance. The live range is packed, so the slot handed out is
 * always the tail of [0, active) and the draw range never has holes. */
function psReserve(pool) {
  if (pool.active >= pool.limit || pool.active >= pool.capacity) return -1;
  const index = pool.active;
  pool.active += 1;
  pool.emitted += 1;
  return index;
}

/* Recycle: the last live instance takes the dead slot. */
function psRelease(pool, index) {
  const last = pool.active - 1;
  if (index !== last) psCopyInstance(pool, last, index);
  pool.active = last;
}

/* Common instance write shared by every emitter. Returns the instance index,
 * or -1 when the pool cannot take another live particle. */
function psSpawn(system, pool, x, y, z, vx, vy, vz, width, aspect, life, alphaPeak, tr, tg, tb) {
  const index = psReserve(pool);
  if (index === -1) return -1;
  const spec = pool.spec;
  const random = system.random;
  const i3 = index * 3;
  const i2 = index * 2;
  pool.pos[i3] = x;
  pool.pos[i3 + 1] = y;
  pool.pos[i3 + 2] = z;
  pool.vel[i3] = vx;
  pool.vel[i3 + 1] = vy;
  pool.vel[i3 + 2] = vz;
  pool.size[i2] = width;
  pool.size[i2 + 1] = width * aspect;
  pool.tint[i3] = tr;
  pool.tint[i3 + 1] = tg;
  pool.tint[i3 + 2] = tb;
  pool.tintA[i3] = tr;
  pool.tintA[i3 + 1] = tg;
  pool.tintA[i3 + 2] = tb;
  pool.base[index] = width;
  pool.aspect[index] = aspect;
  pool.growK[index] = psRange(random, spec.grow);
  pool.spin[index] = (random() * 2 - 1) * spec.spin;
  pool.drag[index] = spec.drag;
  pool.rise[index] = 0;
  pool.seed[index] = random() * 512;
  pool.age[index] = 0;
  pool.life[index] = life;
  pool.peak[index] = alphaPeak;
  pool.alpha[index] = 0;
  pool.roll[index] = random() * PS_TAU;
  pool.ground[index] = psSurfaceY(system, x, z);
  pool.bounce[index] = 0;
  return index;
}

/* ---------------------------------------------------------------------------
 * Emitters - every one of them reads the published exhaust signal
 * ------------------------------------------------------------------------ */

/* The ignition thump: the moment the fire catches, one burst of matter is
 * queued into the pools so the first second of thrust reads as violent. */
function psIgnitionBurst(system) {
  const scale = system.tier.scale;
  const spec = PS_SPEC.ignition;
  const pools = system.pools;
  pools.spark.burst += Math.round(spec.sparks * scale);
  pools.debris.burst += Math.round(spec.debris * scale);
  pools.ember.burst += Math.round(spec.embers * scale);
  pools.smoke.burst += Math.round(spec.smoke * scale);
}

/* Take whatever is queued (ignition burst) plus this frame's share of the
 * rate, and return how many instances may actually be spawned. */
function psDraw(system, pool, rate, dt) {
  if (pool.burst > 0) {
    pool.acc += pool.burst;
    pool.burst = 0;
  }
  pool.acc += rate * dt;
  let count = Math.floor(pool.acc);
  pool.acc -= count;
  if (count <= 0) return 0;
  const room = pool.limit - pool.active;
  if (count > room) count = room;
  return count;
}

/* Pad smoke: the thick cloud that keeps pouring out of the burner hole and the
 * flame trench for as long as the engines are lit - and long after liftoff,
 * because the source is the thrust level, not the vehicle position. */
function psEmitSmoke(system, ctx) {
  const pool = system.pools.smoke;
  const spec = pool.spec;
  const padFall = 1 - 0.42 * clamp01(ctx.altitude / 600);
  const count = psDraw(system, pool, (10 + 78 * ctx.level) * padFall * system.tier.scale, ctx.dt);
  if (count <= 0) return;
  const random = system.random;
  const pad = system.pad;
  const warmRadius = Math.max(14, ctx.gust + 12);
  for (let n = 0; n < count; n += 1) {
    const angle = random() * PS_TAU;
    let x; let y; let z; let vx; let vy; let vz;
    if (random() < 0.42) {
      /* Trench jet: a hard, low, sideways blast out of the corridor. */
      const along = 12 + random() * 34;
      x = pad.x + pad.trenchSign * along;
      z = pad.z + (random() - 0.5) * 11;
      y = pad.apronY + 0.7 + random() * 2.4;
      const speed = (16 + 34 * ctx.level) * (0.55 + 0.5 * random());
      vx = pad.trenchSign * speed;
      vz = (random() - 0.5) * 12;
      vy = 3.0 + 7.0 * random() + 5.0 * ctx.level;
    } else {
      /* The rolling cloud on and around the deck. */
      const radius = 5.5 + random() * 24;
      x = pad.x + Math.cos(angle) * radius + pad.trenchSign * 6 * random();
      z = pad.z + Math.sin(angle) * radius;
      y = pad.deckY + 0.6 + random() * 3.4;
      const speed = (5 + 20 * ctx.level) * (0.4 + random());
      vx = Math.cos(angle) * speed;
      vz = Math.sin(angle) * speed;
      vy = 3.5 + 9.0 * random() * (0.4 + ctx.level);
    }
    const dx = x - ctx.baseX;
    const dy = y - ctx.baseY;
    const dz = z - ctx.baseZ;
    const warm = clamp01(1 - Math.sqrt(dx * dx + dy * dy + dz * dz) / warmRadius) * ctx.level;
    const shade = 0.82 + 0.36 * random();
    const tr = (spec.tint[0] + (spec.tintHot[0] - spec.tint[0]) * warm) * shade;
    const tg = (spec.tint[1] + (spec.tintHot[1] - spec.tint[1]) * warm) * shade;
    const tb = (spec.tint[2] + (spec.tintHot[2] - spec.tint[2]) * warm) * shade;
    const index = psSpawn(system, pool, x, y, z, vx, vy, vz,
      psRange(random, spec.size), spec.aspect * (0.85 + 0.3 * random()),
      psRange(random, spec.life), 0.85 + 0.15 * random(), tr, tg, tb);
    if (index < 0) break;
    pool.rise[index] = (2.6 + 8.5 * ctx.level) * (0.6 + 0.8 * random());
    pool.drag[index] = spec.drag * (0.75 + 0.6 * random());
  }
}

/* The ground dust wall: a ring of dust that starts at the pad, sweeps outward
 * across the terrain sampler and keeps travelling while the vehicle climbs. */
function psEmitDust(system, ctx) {
  const pool = system.pools.dust;
  const spec = pool.spec;
  const pad = system.pad;
  const random = system.random;

  const travel = (PS_SPEC.dust.speedBase + PS_SPEC.dust.speedThrust * ctx.level) *
    (1 + PS_SPEC.dust.altitudeBoost * clamp01(ctx.altitude / PS_SPEC.dust.altitudeScale));
  let radius = system.dustRadius;
  if (ctx.level > 0.04) {
    radius = Math.min(PS_SPEC.dust.maxRadius, radius + travel * ctx.dt);
  } else if (radius > PS_SPEC.dust.startRadius) {
    radius += (PS_SPEC.dust.startRadius - radius) * (1 - Math.exp(-ctx.dt * PS_SPEC.dust.recapture));
  }
  system.dustRadius = radius;

  const groundFall = 1 - 0.45 * clamp01(ctx.altitude / 520);
  const count = psDraw(system, pool, (5 + 52 * ctx.level) * groundFall * system.tier.scale, ctx.dt);
  if (count <= 0) return;
  for (let n = 0; n < count; n += 1) {
    const angle = random() * PS_TAU;
    const band = 0.58 + 0.5 * Math.sqrt(random());
    const r = Math.max(3.5, radius * band);
    const x = pad.x + Math.cos(angle) * r;
    const z = pad.z + Math.sin(angle) * r;
    const surface = psSurfaceY(system, x, z);
    const y = surface + PS_SPEC.dust.hover + random() * 0.9;
    const speed = (2.5 + 9.5 * ctx.level) * (0.6 + 0.7 * random());
    const warm = clamp01(1 - r / 55) * ctx.level;
    const shade = 0.86 + 0.28 * random();
    const tr = (spec.tint[0] + (spec.tintHot[0] - spec.tint[0]) * warm) * shade;
    const tg = (spec.tint[1] + (spec.tintHot[1] - spec.tint[1]) * warm) * shade;
    const tb = (spec.tint[2] + (spec.tintHot[2] - spec.tint[2]) * warm) * shade;
    const width = psRange(random, spec.size) * (0.8 + 0.4 * Math.min(1, radius / 120));
    const index = psSpawn(system, pool, x, y, z,
      Math.cos(angle) * speed, 0.7 + 2.6 * ctx.level * random(), Math.sin(angle) * speed,
      width, spec.aspect * (0.85 + 0.35 * random()), psRange(random, spec.life),
      0.80 + 0.20 * random(), tr, tg, tb);
    if (index < 0) break;
    pool.rise[index] = 0.35 + 1.7 * ctx.level * (0.3 + 0.7 * random());
    pool.drag[index] = spec.drag * (0.8 + 0.5 * random());
  }
}

/* The bright plume trail: spawned along the published world-space plume, so it
 * stretches with the plume length, thickens where the column widens and always
 * leaves the engine bay rather than a fixed point in space. */
function psEmitTrail(system, ctx) {
  const pool = system.pools.trail;
  const spec = pool.spec;
  if (ctx.level < 0.03 || ctx.trailLength < 1) {
    if (pool.burst > 0) {
      pool.acc += pool.burst;
      pool.burst = 0;
    }
    return;
  }
  const lengthFactor = clamp01(ctx.trailLength / 90);
  const count = psDraw(system, pool, ctx.level * (14 + 96 * lengthFactor) * system.tier.scale, ctx.dt);
  if (count <= 0) return;
  const random = system.random;
  const segments = ctx.segments;
  const segmentCount = segments ? segments.length : 0;
  const coreWidth = Math.max(1.1, ctx.trailWidth * 0.62) *
    (1 + 0.55 * clamp01(ctx.altitude / 300));
  for (let n = 0; n < count; n += 1) {
    const t = Math.pow(random(), 1.55);
    const along = t * ctx.trailLength;
    let columnRadius = ctx.trailWidth * (0.55 + 0.75 * t);
    if (segmentCount > 0) {
      columnRadius = segments[Math.min(segmentCount - 1, Math.floor(t * segmentCount))].radius;
    }
    const lateral = columnRadius * (0.3 + 0.9 * random());
    const lateralAngle = random() * PS_TAU;
    const offA = Math.cos(lateralAngle) * lateral;
    const offB = Math.sin(lateralAngle) * lateral;
    const x = ctx.baseX + ctx.axisX * along + ctx.rightX * offA + ctx.fwdX * offB;
    const y = ctx.baseY + ctx.axisY * along + ctx.rightY * offA + ctx.fwdY * offB;
    const z = ctx.baseZ + ctx.axisZ * along + ctx.rightZ * offA + ctx.fwdZ * offB;
    const speed = (6 + 24 * ctx.level) * (0.5 + 0.8 * random());
    const vx = ctx.axisX * speed + ctx.rightX * (random() - 0.5) * 9;
    const vy = ctx.axisY * speed + ctx.fwdY * (random() - 0.5) * 9 + 1.4;
    const vz = ctx.axisZ * speed + ctx.fwdZ * (random() - 0.5) * 9;
    const heat = clamp01(1.15 - t * 1.5);
    const shade = 0.88 + 0.24 * random();
    const tr = (spec.tint[0] + (spec.tintHot[0] - spec.tint[0]) * heat) * shade;
    const tg = (spec.tint[1] + (spec.tintHot[1] - spec.tint[1]) * heat) * shade;
    const tb = (spec.tint[2] + (spec.tintHot[2] - spec.tint[2]) * heat) * shade;
    const width = coreWidth * (0.7 + 0.75 * random()) * (0.35 + 0.65 * Math.sqrt(t + 0.28));
    const index = psSpawn(system, pool, x, y, z, vx, vy, vz, width, spec.aspect,
      psRange(random, spec.life),
      (0.70 + 0.30 * ctx.flicker) * (0.80 + 0.20 * random()), tr, tg, tb);
    if (index < 0) break;
    pool.rise[index] = 1.2 + 3.0 * ctx.level;
    pool.drag[index] = spec.drag * (0.8 + 0.5 * random());
  }
}

/* Sparks: thrown off the flame and off the pad, ballistic, bouncing on the
 * deck and the apron and cooling from white-hot to dull red before they die. */
function psEmitSparks(system, ctx) {
  const pool = system.pools.spark;
  const spec = pool.spec;
  const count = psDraw(system, pool,
    Math.pow(ctx.level, 1.5) * (44 + 96 * ctx.level) * system.tier.scale, ctx.dt);
  if (count <= 0) return;
  const random = system.random;
  const pad = system.pad;
  const anchors = ctx.anchors;
  const fromEngine = anchors && anchors.length
    ? clamp01(0.35 + ctx.altitude / 120) : 0;
  for (let n = 0; n < count; n += 1) {
    let x; let y; let z; let vx; let vy; let vz;
    if (fromEngine > 0 && random() < fromEngine) {
      const entry = anchors[Math.floor(random() * anchors.length)];
