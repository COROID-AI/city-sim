<!-- Pinned Three.js ES-module CDN (r160 removed the UMD builds). -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
/* ===========================================================================
   ROCKET LAUNCH — single self-contained Three.js scene.
   Everything (geometry, textures, particles, post FX) is generated in code.
   No build step, no assets, no UI: the viewport contains only the 3D scene.
   =========================================================================== */

/* ---------------------------------------------------------------------------
   SECTION 0 — MODULE BOOTSTRAP (CDN import with a single-host fallback)
   --------------------------------------------------------------------------- */
const CDN_FALLBACK = 'https://unpkg.com/three@0.160.0/build/three.module.js';
let THREE;
try {
  THREE = await import('three');
} catch (err) {
  THREE = await import(CDN_FALLBACK);
}

/* ---------------------------------------------------------------------------
   SECTION 1 — CONSTANTS, MATH AND SMALL UTILITIES
   --------------------------------------------------------------------------- */
const PAD_Y = 20;            // launch-pad deck height (top surface)
const ROCKET_BODY = 100;     // cylindrical body length
const ROCKET_NOSE = 34;      // ogive nose length
const ROCKET_HEIGHT = ROCKET_BODY + ROCKET_NOSE;
const ROCKET_TAIL = 14;      // thrust structure below the tank skirt

// Deterministic timeline (seconds).
const T = {
  ignite: 3.0,          // engines begin to light
  igniteFull: 6.0,      // flames well established
  thrustEnd: 9.0,       // full thrust achieved
  release: 9.6,         // hold-down clamps + swing arms retract
  liftoff: 10.0,        // first vertical motion
  max: 90.0             // nominal end of the sequence
};

// Flight profile: smooth, powerful, monotonic acceleration.
const V_MAX = 90;
const TAU_V = 5;
const CLIMB_FULL = 48;  // time at which the pull-back finishes

const SUN_DIR = new THREE.Vector3(0.63, 0.70, 0.33).normalize();
const FOG_COLOR = new THREE.Color(0x9cc8ef);

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const clamp01 = v => clamp(v, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
function smoothstep(a, b, x) {
  const t = clamp01((x - a) / (b - a || 1e-6));
  return t * t * (3 - 2 * t);
}

// JS value noise (used for terrain, layout jitter and organic curves).
function hash2(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy);
  const c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return a * (1 - ux) * (1 - uy) + b * ux * (1 - uy) + c * (1 - ux) * uy + d * ux * uy;
}
function fbm2(x, y, oct) {
  let s = 0, a = 0.5, f = 1, norm = 0;
  for (let i = 0; i < (oct || 4); i++) { s += a * vnoise(x * f, y * f); norm += a; f *= 2.03; a *= 0.5; }
  return s / norm;
}
// Deterministic pseudo-random stream so the scene is identical every load.
let _seed = 1337;
function rnd() { _seed = (_seed * 1664525 + 1013904223) % 4294967296; return _seed / 4294967296; }
function rndRange(a, b) { return a + (b - a) * rnd(); }

// Scratch objects (no per-frame allocation).
const _v3a = new THREE.Vector3(), _v3b = new THREE.Vector3(), _v3c = new THREE.Vector3();
const _q = new THREE.Quaternion(), _m4 = new THREE.Matrix4();
const UP = new THREE.Vector3(0, 1, 0);
const _beamDir = new THREE.Vector3(), _beamMid = new THREE.Vector3(), _beamScale = new THREE.Vector3();
const _euler = new THREE.Euler();

/* Shared GLSL: hash / value noise / fbm --- used by every custom shader. */
const GLSL_NOISE = `
float hash11(float p){ p = fract(p * 0.1031); p *= p + 33.33; p *= p + p; return fract(p); }
float hash21(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * vec3(0.1031, 0.1030, 0.0973));
  p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise2(vec2 p){ vec2 i = floor(p); vec2 f = fract(p); f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i); float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0)); float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y); }
float fbm2d(vec2 p){ float s = 0.0; float a = 0.5;
  for(int i = 0; i < 4; i++){ s += a * vnoise2(p); p *= 2.03; a *= 0.5; } return s; }
`;

/* ---------------------------------------------------------------------------
   SECTION 2 — PROCEDURAL TEXTURES (CanvasTexture only; zero external assets)
   --------------------------------------------------------------------------- */
function newCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function finishTexture(canvas, repeatX, repeatY) {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX || 1, repeatY || 1);
  t.anisotropy = 4;
  return t;
}

/* White booster skin: panel seams, rivets, colour bands, soot and grime. */
function makeRocketTexture() {
  const c = newCanvas(1024, 1024), g = c.getContext('2d');
  g.fillStyle = '#f4f3ee'; g.fillRect(0, 0, 1024, 1024);
  // subtle vertical panel shading
  for (let i = 0; i < 40; i++) {
    const x = i * 25.6;
    g.fillStyle = 'rgba(160,170,185,' + (0.04 + 0.05 * hash2(i, 3)) + ')';
    g.fillRect(x, 0, 2, 1024);
  }
  // horizontal panel seams (uv.y 0 == tail)
  for (let j = 0; j < 13; j++) {
    const y = j * 78 + 8;
    g.strokeStyle = 'rgba(120,128,140,0.55)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, y); g.lineTo(1024, y); g.stroke();
  }
  // rivet rows
  for (let j = 0; j < 13; j++) {
    const y = j * 78 + 8;
    for (let i = 0; i < 64; i++) {
      g.fillStyle = 'rgba(140,148,160,0.5)';
      g.beginPath(); g.arc(i * 16 + 6, y + 6, 1.6, 0, 6.2832); g.fill();
    }
  }
  // red roll-pattern band near the tail
  g.fillStyle = '#d22b26'; g.fillRect(0, 60, 1024, 62);
  g.fillStyle = 'rgba(255,255,255,0.22)'; g.fillRect(0, 60, 1024, 8);
  // blue field with white star cluster (abstract livery, no lettering)
  g.fillStyle = '#1e58c8'; g.fillRect(0, 330, 1024, 118);
  g.fillStyle = '#ffffff';
  for (let i = 0; i < 7; i++) {
    const cx = 80 + i * 143, cy = 389, r = 17;
    g.beginPath();
    for (let k = 0; k < 10; k++) {
      const rr = k % 2 ? r * 0.44 : r;
      const a = -Math.PI / 2 + k * Math.PI / 5;
      const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
      if (k === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath(); g.fill();
  }
  // hazard chevrons near the thrust structure
  for (let i = 0; i < 34; i++) {
    g.fillStyle = i % 2 ? '#ffd21f' : '#2b2b2b';
    g.save(); g.beginPath();
    g.moveTo(i * 30, 14); g.lineTo(i * 30 + 20, 14); g.lineTo(i * 30 + 8, 46); g.lineTo(i * 30 - 12, 46);
    g.closePath(); g.fill(); g.restore();
  }
  // exhaust soot + weathering streaks
  for (let i = 0; i < 260; i++) {
    const x = rndRange(0, 1024), y = rndRange(0, 130), w = rndRange(2, 16), h = rndRange(10, 90);
    g.fillStyle = 'rgba(40,38,36,' + rndRange(0.02, 0.12) + ')';
    g.fillRect(x, y, w, h);
  }
  for (let i = 0; i < 90; i++) {
    const x = rndRange(0, 1024), y = rndRange(0, 1024);
    g.fillStyle = 'rgba(150,150,145,' + rndRange(0.02, 0.08) + ')';
    g.fillRect(x, y, rndRange(3, 26), rndRange(2, 30));
  }
  return finishTexture(c, 1, 1);
}

/* Painted structural steel (tower, masts, pipes). */
function makeSteelTexture(base, accent, repeat) {
  const c = newCanvas(256, 256), g = c.getContext('2d');
  g.fillStyle = base; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 900; i++) {
    g.fillStyle = 'rgba(0,0,0,' + rndRange(0.01, 0.07) + ')';
    g.fillRect(rndRange(0, 256), rndRange(0, 256), rndRange(1, 5), rndRange(1, 5));
  }
  g.fillStyle = accent; g.fillRect(0, 0, 256, 10); g.fillRect(0, 246, 256, 10);
  g.fillStyle = 'rgba(255,255,255,0.10)'; g.fillRect(0, 0, 6, 256);
  for (let i = 0; i < 22; i++) {
    g.fillStyle = 'rgba(30,30,30,0.35)';
    g.beginPath(); g.arc(rndRange(8, 248), rndRange(8, 248), 2.4, 0, 6.2832); g.fill();
  }
  return finishTexture(c, repeat || 3, repeat || 3);
}

/* Concrete apron with expansion joints and wear. */
function makeConcreteTexture() {
  const c = newCanvas(512, 512), g = c.getContext('2d');
  g.fillStyle = '#b9b7ad'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 9000; i++) {
    const v = rndRange(0.03, 0.16);
    g.fillStyle = (rnd() > 0.5 ? 'rgba(255,255,255,' : 'rgba(60,58,54,') + v + ')';
    g.fillRect(rndRange(0, 512), rndRange(0, 512), rndRange(1, 4), rndRange(1, 4));
  }
  g.strokeStyle = 'rgba(80,78,74,0.7)'; g.lineWidth = 3;
  for (let i = 0; i <= 4; i++) {
    g.beginPath(); g.moveTo(i * 128, 0); g.lineTo(i * 128, 512); g.stroke();
    g.beginPath(); g.moveTo(0, i * 128); g.lineTo(512, i * 128); g.stroke();
  }
  for (let i = 0; i < 40; i++) {
    g.fillStyle = 'rgba(90,86,80,' + rndRange(0.05, 0.18) + ')';
    g.fillRect(rndRange(0, 512), rndRange(0, 512), rndRange(10, 80), rndRange(4, 26));
  }
  return finishTexture(c, 6, 6);
}

/* Soft billowing puff sprite (smoke / dust / clouds). */
function makePuffTexture(size, blobs, hardness) {
  const s = size || 256;
  const c = newCanvas(s, s), g = c.getContext('2d');
  g.clearRect(0, 0, s, s);
  for (let i = 0; i < blobs; i++) {
    const a = rnd() * 6.2832;
    const rad = rnd() * s * 0.24;
    const x = s / 2 + Math.cos(a) * rad, y = s / 2 + Math.sin(a) * rad;
    const r = s * (0.12 + rnd() * 0.20);
    const grd = g.createRadialGradient(x, y, r * 0.05, x, y, r);
    const peak = 0.32 + rnd() * 0.30;
    grd.addColorStop(0, 'rgba(255,255,255,' + peak + ')');
    grd.addColorStop(hardness || 0.45, 'rgba(255,255,255,' + (peak * 0.5) + ')');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd;
    g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
  }
  // hard mask so the sprite never shows a square edge
  const m = g.createRadialGradient(s / 2, s / 2, s * 0.30, s / 2, s / 2, s * 0.50);
  m.addColorStop(0, 'rgba(0,0,0,0)');
  m.addColorStop(1, 'rgba(0,0,0,1)');
  g.globalCompositeOperation = 'destination-out';
  g.fillStyle = m; g.fillRect(0, 0, s, s);
  g.globalCompositeOperation = 'source-over';
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* Additive radial glow (sparks, embers, engine bloom source). */
function makeGlowTexture(size, core) {
  const s = size || 128;
  const c = newCanvas(s, s), g = c.getContext('2d');
  const grd = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  grd.addColorStop(0, 'rgba(255,255,255,1)');
  grd.addColorStop(core || 0.18, 'rgba(255,240,205,0.85)');
  grd.addColorStop(0.45, 'rgba(255,170,70,0.28)');
  grd.addColorStop(1, 'rgba(255,120,30,0)');
  g.fillStyle = grd; g.fillRect(0, 0, s, s);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* High-frequency terrain detail (fine grain + soft blots) so the landscape
   keeps texture and contrast even when seen from high altitude. */
function makeTerrainDetailTexture() {
  const c = newCanvas(512, 512), g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 24000; i++) {
    g.fillStyle = rnd() > 0.5 ? 'rgba(255,255,250,0.45)' : 'rgba(74,72,58,0.45)';
    g.fillRect(rndRange(0, 512), rndRange(0, 512), 1.6, 1.6);
  }
  for (let i = 0; i < 300; i++) {
    const x = rndRange(0, 512), y = rndRange(0, 512), r = rndRange(5, 44);
    const grd = g.createRadialGradient(x, y, 0, x, y, r);
    grd.addColorStop(0, rnd() > 0.5 ? 'rgba(58,58,46,0.32)' : 'rgba(255,252,232,0.30)');
    grd.addColorStop(1, 'rgba(128,128,128,0)');
    g.fillStyle = grd;
    g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
  }
  return finishDetailTexture(finishTexture(c, 140, 140));
}
/* Detail maps are sampled at grazing angles across the whole landscape, so
   anisotropic filtering is left off: it is the single most expensive texture
   operation in a software rasteriser. */
function finishDetailTexture(t) { t.anisotropy = 1; return t; }

const TEX = {
  rocket: makeRocketTexture(),
  steelRed: makeSteelTexture('#c8452f', '#f4d03f', 3),
  steelGrey: makeSteelTexture('#9aa1a8', '#5e666e', 4),
  steelWhite: makeSteelTexture('#e6e8ea', '#b9bec4', 3),
  concrete: makeConcreteTexture(),
  puff: makePuffTexture(256, 26, 0.42),
  dust: makePuffTexture(256, 30, 0.30),
  cloud: makePuffTexture(256, 34, 0.30),
  terrain: makeTerrainDetailTexture(),
  glow: makeGlowTexture(128, 0.16),
  spark: makeGlowTexture(64, 0.30)
};

/* ---------------------------------------------------------------------------
   SECTION 3 — RENDERER, CAMERA, SCENE AND POST-PROCESSING PIPELINE
   --------------------------------------------------------------------------- */
const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({
  canvas, antialias: false, alpha: false, stencil: false, powerPreference: 'high-performance'
});
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
// The shadow casters are mostly static, so the depth pass runs every other
// frame — halves the fixed per-frame cost without any visible difference.
renderer.shadowMap.autoUpdate = false;
renderer.setClearColor(0x9dcbf5, 1);
renderer.info.autoReset = false;   // accumulate across the whole post chain

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(FOG_COLOR.getHex(), 0.000019);

const camera = new THREE.PerspectiveCamera(50, 1, 1, 60000);

/* --- full-screen post pass helper (ortho quad, no addons) --- */
const postScene = new THREE.Scene();
const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
postQuad.frustumCulled = false;
postScene.add(postQuad);
function makePostMaterial(fragment, uniforms) {
  postQuad.material = new THREE.ShaderMaterial({
    uniforms, vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: fragment, depthTest: false, depthWrite: false
  });
  return postQuad.material;
}
const POST_VS = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';

let rtScene = null, rtBright = null, rtBlurA = null, rtBlurB = null, rtHalfA = null, rtHalfB = null;
const RT_OPTS = { type: THREE.HalfFloatType, format: THREE.RGBAFormat, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: false, depthBuffer: false };

const brightMat = new THREE.ShaderMaterial({
  uniforms: { tDiffuse: { value: null }, uThreshold: { value: 1.05 }, uKnee: { value: 0.6 } },
  vertexShader: POST_VS,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uThreshold; uniform float uKnee;
    varying vec2 vUv;
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      float l = dot(c, vec3(0.2126, 0.7152, 0.0722));
      float soft = clamp((l - uThreshold + uKnee) / (uKnee * 2.0), 0.0, 1.0);
      float w = max(l - uThreshold, soft * soft * uKnee * 0.5) / max(l, 1e-4);
      gl_FragColor = vec4(c * w, 1.0);
    }`,
  depthTest: false, depthWrite: false
});

function blurMaterial(dirX, dirY) {
  return new THREE.ShaderMaterial({
    uniforms: { tDiffuse: { value: null }, uDir: { value: new THREE.Vector2(dirX, dirY) }, uTexel: { value: new THREE.Vector2(1 / 256, 1 / 256) } },
    vertexShader: POST_VS,
    fragmentShader: `
      uniform sampler2D tDiffuse; uniform vec2 uDir; uniform vec2 uTexel; varying vec2 vUv;
      void main(){
        vec2 o = uDir * uTexel;
        vec3 s = texture2D(tDiffuse, vUv).rgb * 0.2270270270;
        s += texture2D(tDiffuse, vUv + o * 1.3846153846).rgb * 0.3162162162;
        s += texture2D(tDiffuse, vUv - o * 1.3846153846).rgb * 0.3162162162;
        s += texture2D(tDiffuse, vUv + o * 3.2307692308).rgb * 0.0702702703;
        s += texture2D(tDiffuse, vUv - o * 3.2307692308).rgb * 0.0702702703;
        gl_FragColor = vec4(s, 1.0);
      }`,
    depthTest: false, depthWrite: false
  });
}

/* Final composite: scene + bloom, heat shimmer, ACES tone map, sRGB output. */
const compositeMat = new THREE.ShaderMaterial({
  uniforms: {
    tScene: { value: null }, tBloomA: { value: null }, tBloomB: { value: null },
    uBloom: { value: 1.0 }, uHeat: { value: 0 }, uEngineUV: { value: new THREE.Vector2(0.5, 0.5) },
    uTime: { value: 0 }, uAspect: { value: 1 }, uExposure: { value: 1.0 }
  },
  vertexShader: POST_VS,
  fragmentShader: `
    uniform sampler2D tScene; uniform sampler2D tBloomA; uniform sampler2D tBloomB;
    uniform float uBloom; uniform float uHeat; uniform vec2 uEngineUV;
    uniform float uTime; uniform float uAspect; uniform float uExposure;
    varying vec2 vUv;
    ${GLSL_NOISE}
    void main(){
      vec2 uv = vUv;
      /* Exhaust heat haze, anchored to the nozzle.
         Deliberately local and gentle: the displacement is driven by animated
         noise (a regular sine wobble reads as a full-frame wave banding
         artifact), it is capped at a couple of pixels and it decays to nothing
         a short distance from the nozzle, so only the hot exhaust column
         shimmers and the vehicle, gantry and sky stay rock steady. */
      vec2 rel = vec2((uv.x - uEngineUV.x) * uAspect, uv.y - uEngineUV.y + 0.04);
      vec2 sd = rel / vec2(0.13, 0.22);
      float heat = uHeat * exp(-dot(sd, sd) * 1.8);
      if (heat > 0.002) {
        vec2 np = vec2(uv.x * uAspect, uv.y) * 46.0;
        float n1 = fbm2d(np + vec2(0.0, -uTime * 3.2));
        float n2 = fbm2d(np * 1.71 + vec2(13.1, -uTime * 4.4));
        vec2 wobble = (vec2(n1, n2) - 0.5) * vec2(1.0 / uAspect, 1.0);
        uv += wobble * 0.0048 * heat;
      }
      vec3 col = texture2D(tScene, uv).rgb;
      vec3 bloom = texture2D(tBloomA, uv).rgb * 0.72 + texture2D(tBloomB, uv).rgb * 0.95;
      col += bloom * uBloom;
      col *= uExposure;
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
  depthTest: false, depthWrite: false
});
compositeMat.toneMapped = true;

/* ---------------------------------------------------------------------------
   SECTION 4 — SKY DOME, SUN AND LIGHTING RIG
   --------------------------------------------------------------------------- */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, depthTest: false, fog: false,
  uniforms: {
    uTop: { value: new THREE.Color(0x1450c6) },
    uMid: { value: new THREE.Color(0x4f9ce8) },
    uHorizon: { value: new THREE.Color(0xa6d2f4) },
    uHaze: { value: new THREE.Color(0xe2f1ff) },
    uGround: { value: new THREE.Color(0xc0d6e6) },
    uSun: { value: SUN_DIR.clone() },
    uTime: { value: 0 }
  },
  vertexShader: 'varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
  fragmentShader: `
    uniform vec3 uTop; uniform vec3 uMid; uniform vec3 uHorizon; uniform vec3 uHaze; uniform vec3 uGround;
    uniform vec3 uSun; uniform float uTime;
    varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir);
      float h = clamp(d.y, -1.0, 1.0);
      float up = clamp(h, 0.0, 1.0);
      vec3 col = mix(uHorizon, uMid, sqrt(up) * 0.72 + up * 0.28);
      col = mix(col, uTop, up * up);
      col = mix(col, uHaze, exp(-abs(h) * 30.0) * 0.90);

function terrainHeight(x, z) {
  const d = Math.hypot(x, z);
  const flatten = smoothstep(300, 1100, d);
  let h = (fbm2(x * 0.00032, z * 0.00032, 4) - 0.5) * 300;
  h += (fbm2(x * 0.0015 + 13.7, z * 0.0015 - 4.2, 3) - 0.5) * 78;
  h += (fbm2(x * 0.006 + 91.3, z * 0.006 + 7.1, 2) - 0.5) * 12;
  h = Math.max(h, -26);
  return h * flatten;
}
(function buildTerrain() {
  const SIZE = 50000, SEG = 160;
  const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const colors = new Float32Array(pos.count * 3);
  const c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const y = terrainHeight(x, z);
    pos.setY(i, y);
    // patchwork farmland palette (bright, colourful daytime terrain)
    const patch = fbm2(x * 0.00042 + 5.1, z * 0.00042 - 2.7, 3);
    const patch2 = fbm2(x * 0.0016 - 21.4, z * 0.0016 + 9.9, 2);
    const near = 1 - smoothstep(200, 1500, Math.hypot(x, z));
    let hue = 0.245 - patch * 0.075 + patch2 * 0.035;
    let sat = 0.55 + patch2 * 0.28;
    let lit = 0.30 + patch * 0.22 + (y > 90 ? 0.08 : 0);
    if (patch2 > 0.72) { hue = 0.135; sat = 0.55; lit = 0.44; }         // harvested field
    if (patch > 0.78 && patch2 < 0.4) { hue = 0.52; sat = 0.34; }        // water meadow
    hue = lerp(hue, 0.10, near * 0.75); sat = lerp(sat, 0.34, near * 0.7); lit = lerp(lit, 0.40, near * 0.6);
    c.setHSL(hue, clamp01(sat), clamp01(lit));
    colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true, map: TEX.terrain });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.receiveShadow = false;
  scene.add(mesh);

  // Distant mountain ring: one instanced draw for the bodies, one for the
  // snow caps. Per-instance colour keeps the palette varied.
  const hillGeo = new THREE.SphereGeometry(1, 14, 10, 0, Math.PI * 2, 0, Math.PI / 2);
  const HILL_COUNT = 46;
  const hillMats = [0x4f7f46, 0x5f8f6a, 0x6d7f5a, 0x7b8fa8];
  const hills = new THREE.InstancedMesh(hillGeo, new THREE.MeshLambertMaterial({ color: 0xffffff }), HILL_COUNT);
  const caps = new THREE.InstancedMesh(hillGeo, new THREE.MeshLambertMaterial({ color: 0xf2f7fb }), HILL_COUNT);
  const hillScale = new THREE.Vector3(), hillPos = new THREE.Vector3(), scl = new THREE.Vector3();
  const hcol = new THREE.Color();
  let capCount = 0;
  for (let i = 0; i < HILL_COUNT; i++) {
    const a = (i / HILL_COUNT) * Math.PI * 2 + rndRange(-0.05, 0.05);
    const dist = rndRange(5200, 17000);
    const hgt = rndRange(360, 1250) * (0.55 + dist / 17000);
    const rad = rndRange(900, 2600);
    hillPos.set(Math.cos(a) * dist, -hgt * 0.12, Math.sin(a) * dist);
    hillScale.set(rad, hgt, rad * rndRange(0.7, 1.25));
    _q.setFromAxisAngle(UP, rnd() * 6.2832);
    _m4.compose(hillPos, _q, hillScale);
    hills.setMatrixAt(i, _m4);
    hills.setColorAt(i, hcol.setHex(hillMats[i % hillMats.length]));
    if (hgt > 800) {
      scl.set(rad * 0.42, hgt * 0.42, rad * 0.42 * rndRange(0.7, 1.2));
      hillPos.set(Math.cos(a) * dist, -hgt * 0.12 + hgt * 0.58, Math.sin(a) * dist);

/* Static meshes are merged per material: draw-call count, not pixel count, is
   the dominant cost on software rasterisers. Animated sub-trees are tagged
   with userData.animated and left untouched. */
function mergeStaticMeshes(root) {
  root.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(root.matrixWorld).invert();
  const candidates = [];
  root.traverse(o => {
    if (!o.isMesh || o.isInstancedMesh || o.isSkinnedMesh) return;
    if (!o.geometry || !o.geometry.attributes || !o.geometry.attributes.position) return;
    if (!o.material || o.material.isShaderMaterial && o.material.transparent) return;
    let p = o, animated = false;
    while (p && p !== root) {
      if (p.userData && p.userData.animated) { animated = true; break; }
      p = p.parent;
    }
    if (!animated) candidates.push(o);
  });
  const byMat = new Map();
  for (const m of candidates) {
    if (!byMat.has(m.material)) byMat.set(m.material, []);
    byMat.get(m.material).push(m);
  }
  let merged = 0;
  for (const [mat, list] of byMat) {
    if (list.length < 2) continue;
    const parts = [];
    let total = 0;
    const rel = new THREE.Matrix4();
    for (const m of list) {
      m.updateMatrixWorld(true);
      rel.copy(inv).multiply(m.matrixWorld);
      const g = m.geometry.index ? m.geometry.toNonIndexed() : m.geometry.clone();
      g.applyMatrix4(rel);
      parts.push(g);
      total += g.attributes.position.count;
    }
    const pos = new Float32Array(total * 3);
    const nrm = new Float32Array(total * 3);
    const tex = new Float32Array(total * 2);
    let off = 0;
    for (const g of parts) {
      const c = g.attributes.position.count;
      pos.set(g.attributes.position.array.subarray(0, c * 3), off * 3);
      if (g.attributes.normal) nrm.set(g.attributes.normal.array.subarray(0, c * 3), off * 3);
      if (g.attributes.uv) tex.set(g.attributes.uv.array.subarray(0, c * 2), off * 2);
      off += c;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(nrm, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(tex, 2));
    geo.computeBoundingSphere();
    const out = new THREE.Mesh(geo, mat);
    out.castShadow = list[0].castShadow;
    out.receiveShadow = list[0].receiveShadow;
    root.add(out);
    for (const m of list) if (m.parent) m.parent.remove(m);
    for (const g of parts) g.dispose();
    merged += list.length - 1;
  }
  return merged;
}

    uB: { value: new THREE.Color(1, 0.3, 0) }, uSoft: { value: 0.5 }, uGain: { value: 1 }
  },
  vertexShader: `
    uniform float uProfileR;
    varying vec2 vUvf; varying float vY; varying float vR;
    void main(){
      vUvf = uv; vY = uv.y; vR = length(position.xz) / uProfileR;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);

  fragmentShader: `
    uniform float uTime; uniform float uIntensity; uniform float uFlicker; uniform float uSeed;
    uniform vec3 uA; uniform vec3 uB; uniform float uSoft; uniform float uGain;
    varying vec2 vUvf; varying float vY; varying float vR;
    ${GLSL_NOISE}
    void main(){
      float t = uTime;
      float ang = vUvf.x * 6.2831853;
      vec2 ring = vec2(cos(ang), sin(ang));
      float n1 = fbm2d(ring * 3.0 + vec2(uSeed, vY * 6.0 - t * 2.6));
      float n2 = fbm2d(ring * 7.0 + vec2(-uSeed * 1.7, vY * 13.0 - t * 4.7));

      float a = pow(shape, 0.85) * (0.55 + 0.85 * turb) * uIntensity * uFlicker * uGain;

   --------------------------------------------------------------------------- */
/* Every particle is a pure function of sim time: age is derived from a seeded
   birth time, so seek(t) is exact and the CPU cost per frame is one uniform. */
function smokeShader(kind) {
  return new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 }, uLife: { value: 20 }, uBirthStart: { value: 0 }, uBirthRamp: { value: 1 },
      uEmitter: { value: new THREE.Vector3(0, PAD_Y, 0) }, uSpread: { value: 0 }, uRise: { value: 12 },
      uSwirl: { value: 0.6 }, uSize: { value: 40 }, uOpacity: { value: 0.75 }, uTex: { value: TEX.puff },
      uTint: { value: new THREE.Color(0xffffff) }, uShade: { value: new THREE.Color(0xbfc3c9) },
      uEnginePos: { value: new THREE.Vector3(0, PAD_Y, 0) }, uHeat: { value: 0 }, uRecycle: { value: 1 },
      uVmax: { value: V_MAX }, uTauV: { value: TAU_V }, uLiftoff: { value: T.liftoff },
      uPadY: { value: PAD_Y }, uFogColor: { value: FOG_COLOR }, uFollow: { value: 0 }
    },
    vertexShader: `
      attribute vec4 iSeed;   // x: angle  y: radial bias  z: size bias  w: birth bias
      uniform float uTime, uLife, uBirthStart, uBirthRamp, uSpread, uRise, uSwirl, uSize, uFollow, uRecycle;
      uniform vec3 uEmitter;
      uniform float uVmax, uTauV, uLiftoff, uPadY;
      varying vec2 vUv; varying float vAlpha; varying vec3 vWorld; varying float vSeed;
      float altAt(float t){
        float tau = t - uLiftoff;
        if (tau <= 0.0) return 0.0;
        return uVmax * (tau - uTauV * (1.0 - exp(-tau / uTauV)));
      }
      void main(){
        vUv = uv;
        float birth = uBirthStart + iSeed.w * uBirthRamp;
        float raw = uTime - birth;
        float live = step(0.0, raw);
        float age = mix(max(raw, 0.0), mod(max(raw, 0.0), uLife), uRecycle);
        float an = clamp(age / uLife, 0.0, 1.0);
        float a = iSeed.x * 6.2831853;
        float grow = pow(an, 0.55);
        float rad = uSpread * (0.12 + iSeed.y) * grow;
        float swirl = a + an * (1.2 + iSeed.y) * uSwirl;
        vec3 base = uEmitter;
        if (uFollow > 0.5) base.y = uPadY + altAt(birth);
        vec3 p = base;

/* Targets follow the current render budget: in a software rasteriser the
   per-framebuffer cost is proportional to the allocation, so allocating exactly
   what is needed beats rendering a sub-rectangle of a larger buffer. The
   adaptive controller is throttled so reallocations stay rare. */
function allocTargets(pr) {
  disposeTargets();
  const w = Math.max(2, Math.floor(viewW * pr)), h = Math.max(2, Math.floor(viewH * pr));
  rtScene = new THREE.WebGLRenderTarget(w, h, Object.assign({ depthBuffer: true }, RT_OPTS));
  const bw = Math.max(2, Math.floor(w / 4)), bh = Math.max(2, Math.floor(h / 4));
  rtBright = new THREE.WebGLRenderTarget(bw, bh, RT_OPTS);
  rtBlurA = new THREE.WebGLRenderTarget(bw, bh, RT_OPTS);
  rtBlurB = new THREE.WebGLRenderTarget(bw, bh, RT_OPTS);
  const hw = Math.max(2, Math.floor(w / 8)), hh = Math.max(2, Math.floor(h / 8));
  rtHalfA = new THREE.WebGLRenderTarget(hw, hh, RT_OPTS);
  rtHalfB = new THREE.WebGLRenderTarget(hw, hh, RT_OPTS);
  renderer.setPixelRatio(1);
  renderer.setSize(viewW, viewH, false);
  compositeMat.uniforms.uAspect.value = viewW / Math.max(1, viewH);
}
/* Instance counts follow the render budget so a heavy fill-rate scene stays
   fluid on software rasterisers without altering the deterministic simulation. */
function applyParticleScale(f) {
  const s = clamp(f, 0.25, 1);
  const sizeScale = 0.55 + 0.45 * s;
  for (const sys of SMOKE_SYSTEMS) {
    if (sys.size0 === undefined) sys.size0 = sys.mat.uniforms.uSize.value;
    sys.mesh.geometry.instanceCount = Math.max(12, Math.round(sys.count * s));
    sys.mat.uniforms.uSize.value = sys.size0 * sizeScale;
  }
  for (const sys of PARTICLE_SYSTEMS) {
    if (sys.size0 === undefined) sys.size0 = sys.mat.uniforms.uSize.value;
    sys.mesh.geometry.instanceCount = Math.max(10, Math.round(sys.count * s));
    sys.mat.uniforms.uSize.value = sys.size0 * sizeScale;
  }
  const grassScale = 0.32 + 0.68 * s;
  for (let i = 0; i < grassMeshes.length; i++) {
    const total = GRASS_ZONES[i] ? GRASS_ZONES[i].count : 0;
    grassMeshes[i].geometry.setDrawRange(0, Math.max(240, Math.round(total * grassScale)) * 6);
  }
}
function particleScaleFor(scale) { return 0.45 + 0.55 * clamp01((scale - 0.4) / 0.6); }

function resize() {
  viewW = Math.max(1, window.innerWidth);
  viewH = Math.max(1, window.innerHeight);
  camera.aspect = viewW / viewH;
  camera.updateProjectionMatrix();
  allocTargets(renderScale * Math.min(window.devicePixelRatio || 1, 2));
  applyParticleScale(particleScaleFor(renderScale));
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);

const QUALITY_PRESETS = {
  low: { scale: 0.42, glow: 0.85, shadows: false },
  medium: { scale: 0.72, glow: 1.0, shadows: true },
  high: { scale: 1.0, glow: 1.0, shadows: true }
};
function applyQuality(name) {
  qualityName = name; qualityLocked = name !== 'auto';
  if (name === 'auto') {
    renderer.shadowMap.enabled = QUALITY_PRESETS.high.shadows;
    compositeMat.uniforms.uBloom.value = QUALITY_PRESETS.high.glow;
    resize();
    return;
  }
  const preset = QUALITY_PRESETS[name] || QUALITY_PRESETS.high;
  renderScale = preset.scale;
  renderer.shadowMap.enabled = preset.shadows;
  compositeMat.uniforms.uBloom.value = preset.glow;
  resize();
}
/* Time-based, throttled, hysteretic adaptation: reallocating render targets
   every frame would itself cause stalls, but a frame-count trigger would never
   fire on a very slow software rasteriser. */
let perfAccum = 0, perfSamples = 0, perfCooldownMs = 0;
function adaptQuality(frameSeconds) {
  if (qualityLocked || paused) return;
  perfAccum += frameSeconds; perfSamples++;
  if (perfCooldownMs > 0) { perfCooldownMs -= frameSeconds * 1000; return; }
  if (perfAccum < 1.2) return;
  const avg = perfAccum / perfSamples;
  perfAccum = 0; perfSamples = 0;
  let next = renderScale;
  if (avg > 0.14) next = Math.max(0.34, renderScale - 0.16);
  else if (avg > 0.085) next = Math.max(0.45, renderScale - 0.10);
  else if (avg < 0.028) next = Math.min(1.0, renderScale + 0.06);
  if (Math.abs(next - renderScale) > 0.004) {
    renderScale = next;
    perfCooldownMs = 2500;
    resize();
  }
}

function renderFrame() {
  renderer.info.reset();
  renderer.setRenderTarget(rtScene);
  renderer.clear();
  renderer.render(scene, camera);
  // bright pass
  postQuad.material = brightMat;
  brightMat.uniforms.tDiffuse.value = rtScene.texture;
  renderer.setRenderTarget(rtBright);
  renderer.render(postScene, postCamera);
  // blur chain (quarter res then eighth res)
  postQuad.material = blurH;
  blurH.uniforms.tDiffuse.value = rtBright.texture;
  blurH.uniforms.uTexel.value.set(1 / rtBright.width, 1 / rtBright.height);
  renderer.setRenderTarget(rtBlurA);
  renderer.render(postScene, postCamera);
  postQuad.material = blurV;
  blurV.uniforms.tDiffuse.value = rtBlurA.texture;
  blurV.uniforms.uTexel.value.set(1 / rtBlurA.width, 1 / rtBlurA.height);
  renderer.setRenderTarget(rtBlurB);
  renderer.render(postScene, postCamera);
  postQuad.material = blurH;
  blurH.uniforms.tDiffuse.value = rtBlurB.texture;
  blurH.uniforms.uTexel.value.set(1 / rtHalfA.width, 1 / rtHalfA.height);
  renderer.setRenderTarget(rtHalfA);
  renderer.render(postScene, postCamera);
  postQuad.material = blurV;
  blurV.uniforms.tDiffuse.value = rtHalfA.texture;
  blurV.uniforms.uTexel.value.set(1 / rtHalfB.width, 1 / rtHalfB.height);
  renderer.setRenderTarget(rtHalfB);
  renderer.render(postScene, postCamera);
  // composite to the canvas
  postQuad.material = compositeMat;
  compositeMat.uniforms.tScene.value = rtScene.texture;
  compositeMat.uniforms.tBloomA.value = rtBlurB.texture;
  compositeMat.uniforms.tBloomB.value = rtHalfB.texture;
  renderer.setRenderTarget(null);
  renderer.render(postScene, postCamera);
}

/* ---------------------------------------------------------------------------
   SECTION 17 — PER-FRAME SIMULATION APPLY (pure function of simTime)
   --------------------------------------------------------------------------- */
let simTime = 0;
let engineWorldPos = new THREE.Vector3(0, PAD_Y, 0);
let lastFollowError = 0;
let lastProjectedHeight = 0;
let lastCamInfo = { dist: 250, az: 0.62, el: -0.17, amp: 0 };
let lastVibration = 0;

function applySim(t) {
  const alt = altitudeAt(t);
  const baseY = PAD_Y + alt;
  const th = thrustAt(t);
  const fl = flameAt(t);

  // ---- rocket transform + vibration -------------------------------------
  const vibAmp = 0.22 * shakeAmpAt(t) * (0.35 + 0.65 * th);
  lastVibration = vibAmp;
  rocket.position.set(
    (vnoise(t * 23.0, 1.7) - 0.5) * 2 * vibAmp,
    baseY,
    (vnoise(t * 21.0, 4.2) - 0.5) * 2 * vibAmp
  );
  rocket.rotation.z = (vnoise(t * 19.0, 8.1) - 0.5) * vibAmp * 0.05;
  rocket.rotation.x = (vnoise(t * 17.0, 3.3) - 0.5) * vibAmp * 0.04;

  // ---- engines / clamps / arms ------------------------------------------
  const rel = clampReleaseAt(t);
  for (const c of animProps.clamps) {
    // hold-down clamps swing outward and release the booster
    c.pivot.position.copy(c.home).addScaledVector(c.outward, rel * 17);
    c.pivot.rotation.z = -rel * 0.5;
  }
  for (const a of animProps.swingArms) {
    a.group.rotation.y = -rel * 1.55;
  }

  // ---- flames ------------------------------------------------------------
  const flicker = 0.86 + 0.28 * fbm2(t * 6.5, 3.1, 3);
  const plumeLen = plumeLenAt(t);
  const widths = [1, 1, 1 + 0.22 * clamp01(alt / 3000), 1 + 0.34 * clamp01(alt / 3000)];
  for (let i = 0; i < FLAME_LAYERS.length; i++) {
    const m = FLAME_LAYERS[i];
    const len = FLAME_BASE_LEN[i] * (i === 3 ? plumeLen / 130 : (0.30 + 0.95 * fl));
    m.scale.set(widths[i] * (0.55 + 0.5 * fl), Math.max(0.02, len), widths[i] * (0.55 + 0.5 * fl));
    // kept visible (alpha 0 when cold) so the shaders are compiled at load
    // time instead of hitching at ignition
    m.visible = true;
    m.material.uniforms.uTime.value = t;
    m.material.uniforms.uIntensity.value = fl;
    m.material.uniforms.uFlicker.value = flicker;
  }
  glowCard.position.set(0, ROCKET_TAIL * 0.35, 0);
  const gs = (2.5 + 9 * th) * (0.85 + 0.3 * flicker);
  glowCard.scale.set(gs * 2.4, gs * 2.4, 1);
  glowCard.visible = th > 0.01;
  glowCard.material.opacity = 0.55 + 0.4 * th;
  glowCard.quaternion.copy(camera.quaternion);
  const groundGlowScale = 26 + 44 * th;
  groundGlow.scale.set(groundGlowScale, groundGlowScale, 1);
  groundGlow.material.opacity = 0.85 * th * flicker;
  groundGlow.visible = th > 0.02;

  // ---- dynamic engine lighting ------------------------------------------
  engineWorldPos.set(0, baseY + 4, 0);
  engineLight.position.copy(engineWorldPos);
  engineLight.intensity = 9000 * th * (0.85 + 0.3 * flicker);
  engineCore.position.set(0, baseY + 9, 0);
  engineCore.intensity = 4200 * th * flicker;
  engineGlowLight.position.set(0, baseY + 18, 0);
  engineGlowLight.intensity = 26000 * th;
  hemi.intensity = 1.25 + 0.35 * th;
  sunLight.intensity = 3.15 + 0.35 * th;

  // ---- smoke / particle uniforms ----------------------------------------
  const spread = smokeRadiusAt(t);
  for (const s of SMOKE_SYSTEMS) {
    const u = s.mat.uniforms;
    u.uTime.value = t;
    u.uSpread.value = spread;
    u.uEnginePos.value.copy(engineWorldPos);
    u.uHeat.value = th;
  }
  smokeTrail.mat.uniforms.uEmitter.value.set(0, PAD_Y, 0);
  for (const p of PARTICLE_SYSTEMS) {
    const u = p.mat.uniforms;
    u.uTime.value = t;
    u.uThrust.value = th;
    u.uEmitter.value.set(0, baseY + 2, 0);
  }
  uTimeU.value = t;
  uThrustU.value = th;
  for (const gm of grassMatRefs) gm.uniforms.uGlow.value = th * 0.8;

  // ---- vegetation / loose props (exhaust reaction) -----------------------
  const pd = propDisplacementAt(t);
  for (const o of animProps.loose) {
    const dirX = Math.cos(o.angle), dirZ = Math.sin(o.angle);
    const k = pd * o.mass * (0.35 + 0.65 * vnoise(o.angle * 3.1, 2.2));
    const jitter = 0.5 * th * vnoise(t * 9 + o.angle, 5.5);
    _v3a.set(
      o.home.x + dirX * k + jitter,
      Math.max(2.5, o.home.y - k * 0.22),
      o.home.z + dirZ * k + jitter
    );
    _euler.set(k * 0.03 * o.spin, o.baseRotY, k * 0.05 * o.spin);
    _q.setFromEuler(_euler);
    _m4.compose(_v3a, _q, o.scale);
    o.mesh.setMatrixAt(o.index, _m4);
  }
  for (const m of launchSite.userData.propMeshes) m.instanceMatrix.needsUpdate = true;
  for (const f of animProps.flags) {
    f.mesh.rotation.y = Math.sin(t * 2.4 + f.phase) * 0.22 * (1 + 1.6 * th);
    f.mesh.position.x = f.base.x + th * 3.2 * Math.sin(t * 7.1 + f.phase);
    f.mesh.position.z = f.base.z + th * 3.2 * Math.cos(t * 6.3 + f.phase);
  }
  for (const b of animProps.beacons) {
    const pulse = 0.35 + 0.65 * Math.max(0, Math.sin(t * 3.1 + b.phase));
    b.mesh.material.emissiveIntensity = 0.6 + 2.6 * pulse;
    b.mesh.scale.setScalar(0.85 + 0.35 * pulse);
  }
  // ---- camera ------------------------------------------------------------
  lastCamInfo = updateCamera(t, viewH);
  camera.updateMatrixWorld(true);
  scene.updateMatrixWorld(true);

  // ---- camera-facing cloud billboards with deterministic drift -----------
  cloudMesh.material.uniforms.uTime.value = t;

  // ---- metrics -----------------------------------------------------------
  rocketCenter.set(0, baseY + ROCKET_HEIGHT * 0.5, 0);
  _v3a.set(0, baseY, 0).project(camera);
  _v3b.set(0, baseY + ROCKET_HEIGHT, 0).project(camera);
  lastProjectedHeight = Math.abs(_v3b.y - _v3a.y) * 0.5;
  _v3c.copy(rocketCenter).project(camera);
  lastFollowError = Math.hypot(_v3c.x, _v3c.y);

  // ---- heat haze stays anchored to the nozzle while the engine is on screen
  // (the composite shader keeps it local; see the heat-shimmer pass above) --
  _v3a.copy(engineWorldPos).project(camera);
  const engineOnScreen = _v3a.z < 1 && Math.abs(_v3a.x) < 1.25 && Math.abs(_v3a.y) < 1.25;
  compositeMat.uniforms.uEngineUV.value.set(_v3a.x * 0.5 + 0.5, _v3a.y * 0.5 + 0.5);
  compositeMat.uniforms.uHeat.value = engineOnScreen ? th * 1.15 : 0;
  compositeMat.uniforms.uTime.value = t;
}

/* ---------------------------------------------------------------------------
   SECTION 18 — MAIN LOOP (auto-starts; simulated with a fixed real-time step)
   --------------------------------------------------------------------------- */
let paused = false;
let frames = 0;
let fpsAvg = 0;
let lastMs = performance.now();
let ready = false;

function frame(nowMs) {
  const dtReal = Math.min(0.5, Math.max(0, (nowMs - lastMs) / 1000));
  lastMs = nowMs;
  if (dtReal > 0) fpsAvg = fpsAvg * 0.9 + (1 / dtReal) * 0.1;
  if (!paused) simTime = Math.min(simTime + dtReal, T.max + 400);
  applySim(simTime);
  renderer.shadowMap.needsUpdate = (frames % 2) === 0;
  renderFrame();
  frames++;
  adaptQuality(dtReal);
  // optional camera controls hand back to the cinematic rig once idle
  if (!userCam.dragging && nowMs - (userCam.lastInput || 0) > 2600) {
    // time-constant decay, independent of frame rate
    const fa = Math.exp(-dtReal / 2.5);
    const fz = Math.exp(-dtReal / 1.2);
    userCam.az *= fa; userCam.el *= fa;
    userCam.zoom = 1 + (userCam.zoom - 1) * fz;
    if (Math.abs(userCam.az) < 1e-3) userCam.az = 0;
    if (Math.abs(userCam.el) < 1e-3) userCam.el = 0;
    if (Math.abs(userCam.zoom - 1) < 1e-3) userCam.zoom = 1;
  }
  if (!ready && frames >= 1) ready = true;
  requestAnimationFrame(frame);
}

resize();
applySim(0);
renderFrame();
requestAnimationFrame(ts => { lastMs = ts; frame(ts); });

/* ---------------------------------------------------------------------------
   SECTION 19 — NON-VISUAL DEBUG / VERIFICATION HOOK (no DOM, no text, no HUD)
   --------------------------------------------------------------------------- */
function sample() {
  const t = simTime;
  const ph = phaseInfo(t);
  const alt = altitudeAt(t);
  const th = thrustAt(t);
  const cd = cloudDensityAt(alt);
  return {
    ready, frames, fps: Math.round(fpsAvg * 10) / 10, simTime: t,
    phase: ph.name, phaseIndex: ph.index, quality: qualityName, renderScale,
    paused,
    rocket: {
      baseY: PAD_Y + alt, padY: PAD_Y, altitude: alt,
      velocity: velocityAt(t), acceleration: accelAt(t),
      vibration: lastVibration, projectedScreenHeight: lastProjectedHeight,
      height: ROCKET_HEIGHT
    },
    flame: {
      intensity: flameAt(t), thrust: th, plumeLength: plumeLenAt(t), layerCount: FLAME_LAYERS.length,
      visible: FLAME_LAYERS[0].visible, plumeScale: flamePlume.scale.y
    },
    engineLight: {
      intensity: engineLight.intensity, core: engineCore.intensity, glow: engineGlowLight.intensity
    },
    smoke: {
      particleCount: activeCount(smokeDust, t, 1) + activeCount(smokeColumn, t, 1) + activeCount(smokeTrail, t, 1) + activeCount(steamVent, t, 1),
      groundRadius: smokeRadiusAt(t),
      systems: SMOKE_SYSTEMS.map(s => ({ count: s.count, active: activeCount(s, t, 1) }))
    },
    particles: {
      sparks: activeCount(sparks, t, 1), embers: activeCount(embers, t, 1), debris: activeCount(debris, t, 1),
      active: activeCount(sparks, t, 1) + activeCount(embers, t, 1) + activeCount(debris, t, 1)
    },
    clamps: { released: t >= T.release, releaseTime: T.release, angle: clampReleaseAt(t), swingArms: animProps.swingArms.length, holdDowns: animProps.clamps.length },
    camera: {
      distance: lastCamInfo.dist, azimuth: lastCamInfo.az, elevation: lastCamInfo.el,
      shake: lastCamInfo.amp, followError: lastFollowError, y: camera.position.y, x: camera.position.x
    },
    vegetation: { displacement: grassDisplacementAt(t), count: grassCount, sway: grassMatRefs[0].uniforms.uTime.value },
    props: { displacement: propDisplacementAt(t), count: animProps.loose.length },
    clouds: { insideLayer: cd.index >= 0, layerIndex: cd.index, localDensity: cd.density, layers: CLOUD_LAYERS.map(l => ({ y: l.y, thickness: l.thickness })) },
    render: {
      drawCalls: renderer.info.render.calls, triangles: renderer.info.render.triangles,
      programs: renderer.info.programs ? renderer.info.programs.length : 0,
      geometries: renderer.info.memory.geometries, textures: renderer.info.memory.textures
    }
  };
}
function seek(t) {
  paused = true;
  simTime = clamp(t, 0, T.max + 400);
  applySim(simTime);
  renderFrame();
  return sample();
}
function restart() {
  simTime = 0;
  userCam.az = 0; userCam.el = 0; userCam.zoom = 1;
  paused = false;
  lastMs = performance.now();
  applySim(simTime);
  renderFrame();
  return sample();
}
function play() { paused = false; lastMs = performance.now(); return paused; }
function pause() { paused = true; return paused; }

const LAUNCH = {};
const GETTERS = {
  ready: () => ready,
  phase: () => phaseInfo(simTime).name,
  phaseIndex: () => phaseInfo(simTime).index,
  simTime: () => simTime,
  paused: () => paused,
  frames: () => frames,
  fps: () => fpsAvg,
  quality: () => qualityName,
  renderScale: () => renderScale
};
for (const k of Object.keys(GETTERS)) Object.defineProperty(LAUNCH, k, { get: GETTERS[k], enumerable: true });
LAUNCH.timeline = Object.assign({}, T);
LAUNCH.sample = sample;
LAUNCH.seek = seek;
LAUNCH.restart = restart;
LAUNCH.play = play;
LAUNCH.pause = pause;
LAUNCH.setQuality = q => { applyQuality(q); applySim(simTime); renderFrame(); return qualityName; };
window.__LAUNCH__ = LAUNCH;
</script>
</body>
