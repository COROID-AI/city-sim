<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-wrap">
    <div class="board-shell">
      <canvas id="board" data-testid="board" width="300" height="600"></canvas>
      <div id="ready" class="overlay">
        <h1>Tetris</h1>
        <p>Press any arrow key to start</p>
      </div>
      <div id="game-over" class="overlay hidden">
        <h2>Game Over</h2>
        <p id="final-score"></p>
        <p>Press any arrow key to restart</p>
      </div>
    </div>
    <aside class="panel">
      <section class="stat">
        <span class="label">Score</span>
        <span id="score" class="value">0</span>
      </section>
      <section class="stat">
        <span class="label">Lines</span>
        <span id="lines" class="value">0</span>
      </section>
      <section class="stat">
        <span class="label">Level</span>
        <span id="level" class="value">1</span>
      </section>
      <section class="next">
        <span class="label">Next</span>
        <canvas id="next" data-testid="next" width="120" height="100"></canvas>
      </section>
      <p class="hint">&#9664; &#9654; Move &nbsp;&#9650; Rotate &nbsp;&#9660; Soft drop</p>
    </aside>
  </main>
  <script src="tetris-core.js"></script>
  <script src="game.js"></script>
</body>
</html>
