      new THREE.CylinderGeometry(spec.radius, spec.radius, spec.y1 - spec.y0, segments, 1, false),
      material, name);
    mesh.position.y = (spec.y0 + spec.y1) / 2;
    stages.push({ name: name, y0: spec.y0, y1: spec.y1, radius: spec.radius, mesh: mesh });
    return mesh;
  }

  function stackRing(name, radius, y, tube, material) {
    const ring = rkMesh(body, new THREE.TorusGeometry(radius, tube, 8, 64), material, name);
    ring.rotation.x = Math.PI / 2;
    ring.position.y = y;
    return ring;
  }

  /* ---- aft skirt: ribbed steel with a flange, ribs and a bolt ring ------ */
  parts.skirt = stackCylinder('rocket-aft-skirt', L.skirt, materials.skirt, 48);
  parts.skirtFlange = stackRing('rocket-skirt-flange', L.skirt.radius + 0.06, L.skirt.y0 + 0.14, 0.18, materials.trim);

  const skirtRibs = [];
  for (let i = 0; i < 24; i += 1) {
    const azimuth = (i / 24) * Math.PI * 2;
    skirtRibs.push(rkSurfaceItem(L.skirt.radius + 0.1, (L.skirt.y0 + L.skirt.y1) / 2, azimuth,
      [0.22, (L.skirt.y1 - L.skirt.y0) - 0.6, 0.3]));
  }
  rkInstances(body, 'rocket-skirt-ribs', RK_GEO.box, materials.trim, skirtRibs);

  const skirtBolts = [];
  for (let i = 0; i < 40; i += 1) {
    const azimuth = (i / 40) * Math.PI * 2;
    skirtBolts.push(rkSurfaceItem(L.skirt.radius + 0.03, L.skirt.y0 + 0.55, azimuth, [0.13, 0.16, 0.13], 'radial'));
  }
  rkInstances(body, 'rocket-skirt-bolts', RK_GEO.bolt, materials.bell, skirtBolts, { castShadow: false });

  /* ---- hold-down posts: the deck fittings the hold-down jaws grip ------- */
  const posts = [];
  const postFeet = [];
  for (let i = 0; i < L.posts.azimuthDeg.length; i += 1) {
    const azimuth = L.posts.azimuthDeg[i] * RK_DEG;
    const x = Math.cos(azimuth) * L.posts.radius;
    const z = Math.sin(azimuth) * L.posts.radius;
    posts.push({ p: [x, (L.posts.y0 + L.posts.y1) / 2, z], r: [0, -azimuth, 0], s: [L.posts.size, L.posts.y1 - L.posts.y0, L.posts.size] });
    postFeet.push({ p: [x, 0.16, z], r: [0, -azimuth, 0], s: [L.posts.size + 0.3, 0.32, L.posts.size + 0.3] });
  }
  rkInstances(body, 'rocket-hold-down-posts', RK_GEO.box, materials.trim, posts);
  rkInstances(body, 'rocket-hold-down-feet', RK_GEO.box, materials.warn, postFeet);

  /* ---- core stage: the hull the clamps close on ------------------------- */
  parts.core = stackCylinder('rocket-core-stage', L.core, materials.hull, 56);

  const racewayAz = L.racewayAzimuthDeg * RK_DEG;
  const racewayX = Math.cos(racewayAz) * (L.core.radius + 0.24);
  const racewayZ = Math.sin(racewayAz) * (L.core.radius + 0.24);
  const raceway = rkMesh(body, RK_GEO.box, materials.accentCool, 'rocket-raceway');
  raceway.position.set(racewayX, (L.core.y0 + L.core.y1) / 2, racewayZ);
  raceway.rotation.y = -racewayAz;
  raceway.scale.set(0.4, (L.core.y1 - L.core.y0) * 0.94, 0.62);
  parts.raceway = raceway;

  const racewayClamps = [];
  for (let y = L.core.y0 + 1.4; y < L.core.y1 - 1.0; y += 2.2) {
    racewayClamps.push(rkSurfaceItem(L.core.radius + 0.18, y, racewayAz, [0.52, 0.26, 0.94]));
  }
  rkInstances(body, 'rocket-raceway-clamps', RK_GEO.box, materials.trim, racewayClamps);

  /* ---- interstage and the two separation bands -------------------------- */
  parts.interstage = stackCylinder('rocket-interstage', L.interstage, materials.ribbed, 48);
  stackRing('rocket-interstage-ring-a', L.interstage.radius + 0.05, L.interstage.y0 + 0.24, 0.15, materials.accent);
  stackRing('rocket-interstage-ring-b', L.interstage.radius + 0.05, L.interstage.y1 - 0.24, 0.15, materials.accent);

  /* ---- upper stages: gold foil, joint ring and trim band ---------------- */
  parts.stage2 = stackCylinder('rocket-stage-2', L.stage2, materials.foil, 44);
  stackRing('rocket-stage-2-band', L.stage2.radius + 0.05, L.stage2.y0 + 0.38, 0.16, materials.accent);
  stackRing('rocket-stage-2-top', L.stage2.radius + 0.04, L.stage2.y1 - 0.22, 0.13, materials.trim);

  parts.joint = stackCylinder('rocket-stage-joint', L.joint, materials.ribbed, 40);
  parts.trim = stackCylinder('rocket-trim-band', L.trim, materials.accentCool, 40);

  /* ---- nose cone: lathed elliptical ogive plus a crimson cap ------------ */
  const span = L.fairing.tipY - L.fairing.y0;
  const fairingPoints = [];
  const fairingSteps = 22;
  for (let i = 0; i <= fairingSteps; i += 1) {
    const theta = (i / fairingSteps) * (Math.PI / 2);
    fairingPoints.push(new THREE.Vector2(
      Math.max(0.0015, L.fairing.radius * Math.cos(theta)),
      L.fairing.y0 + span * Math.sin(theta)
    ));
  }
  parts.fairing = rkMesh(body, new THREE.LatheGeometry(fairingPoints, 48), materials.hull, 'rocket-nose-cone');
  stages.push({ name: 'rocket-nose-cone', y0: L.fairing.y0, y1: L.fairing.tipY, radius: L.fairing.radius, mesh: parts.fairing });

  const capTheta = Math.asin(Math.min(0.999, (L.fairing.capY - L.fairing.y0) / span));
  const capPoints = [];
  const capSteps = 8;
  for (let i = 0; i <= capSteps; i += 1) {
    const theta = capTheta + (i / capSteps) * ((Math.PI / 2) - capTheta);
    capPoints.push(new THREE.Vector2(
      Math.max(0.0015, L.fairing.radius * Math.cos(theta)),
      L.fairing.y0 + span * Math.sin(theta)
    ));
  }
  parts.noseCap = rkMesh(body, new THREE.LatheGeometry(capPoints, 48), materials.accent, 'rocket-nose-cap');
  parts.noseCap.scale.set(1.006, 1, 1.006);

  /* four fairing seam ribs hugging the cone */
  const ribU = 0.42;
  const ribTheta = Math.asin(ribU);
  const ribRadius = L.fairing.radius * Math.cos(ribTheta);
  const ribY = L.fairing.y0 + span * Math.sin(ribTheta);
  const ribTilt = Math.atan((L.fairing.radius / span) * Math.tan(ribTheta));
  const fairingRibs = [];
  for (let i = 0; i < 4; i += 1) {
    const azimuth = (45 + i * 90) * RK_DEG;
    fairingRibs.push({
      p: [Math.cos(azimuth) * (ribRadius + 0.05), ribY, Math.sin(azimuth) * (ribRadius + 0.05)],
      r: [0, -azimuth, ribTilt],
      s: [0.1, span * 0.5, 0.26]
    });
  }
  rkInstances(body, 'rocket-fairing-ribs', RK_GEO.box, materials.trim, fairingRibs);
  stackRing('rocket-fairing-seam', L.fairing.radius + 0.02, L.fairing.y0 + 0.28, 0.13, materials.accentCool);

  return { stages: stages, parts: parts };
}

/* Engine cluster: seven bells on one lathed profile, one anchor each, the
 * anchors sitting exactly on the bell exit planes. */
function rkBuildEngines(body, materials) {
  const B = RK_LAYOUT.bell;
  const profile = [];
  const steps = 12;
  for (let i = 0; i <= steps; i += 1) {
    const t = i / steps;                                  // 0 at the exit, 1 at the throat
    profile.push(new THREE.Vector2(
      B.exitRadius + (B.throatRadius - B.exitRadius) * Math.pow(t, 1.7),
      (B.topY - B.exitY) * t
    ));
  }
  const bellGeometry = new THREE.LatheGeometry(profile, 36);

  const items = [];
  const positions = [];
  items.push({ p: [0, B.exitY, 0], r: [0, 0, 0], s: [1, 1, 1] });
  positions.push(new THREE.Vector3(0, B.exitY, 0));
  const ringCount = B.count - 1;
  for (let i = 0; i < ringCount; i += 1) {
    const azimuth = (i / ringCount) * Math.PI * 2 + Math.PI / ringCount;
    const x = Math.cos(azimuth) * B.ringRadius;
    const z = Math.sin(azimuth) * B.ringRadius;
    items.push({ p: [x, B.exitY, z], r: [0, 0, 0], s: [1, 1, 1] });
    positions.push(new THREE.Vector3(x, B.exitY, z));
  }
  const bellMesh = rkInstances(body, 'rocket-engine-bells', bellGeometry, materials.bell, items);

  const anchors = [];
  const direction = new THREE.Vector3(0, -1, 0);
  for (let i = 0; i < positions.length; i += 1) {
    const anchor = new THREE.Object3D();
    anchor.name = 'engine-bell-anchor-' + (i + 1);
    anchor.position.copy(positions[i]);
    anchor.userData = {
      engine: anchor.name,
      index: i,
      exitRadius: B.exitRadius,
      throatRadius: B.throatRadius,
      direction: [0, -1, 0]
    };
    body.add(anchor);
    anchors.push({
      name: anchor.name,
      index: i,
      anchor: anchor,
      bellMesh: bellMesh,
      bellInstanceIndex: i,
      exitRadius: B.exitRadius,
      throatRadius: B.throatRadius,
      localPosition: positions[i].clone(),
      direction: direction.clone()
    });
  }

  return { bellMesh: bellMesh, anchors: anchors, count: positions.length, geometry: bellGeometry };
}

/* Four swept aerodynamic fins, one extruded profile instance per azimuth. */
function rkBuildFins(body, materials) {
  const F = RK_LAYOUT.fins;
  const shape = new THREE.Shape();
  shape.moveTo(F.rootRadius, F.yTop);
  shape.lineTo(F.tipRadius, F.yBottom + (F.yTop - F.yBottom) * 0.52);
  shape.lineTo(F.tipRadius, F.yBottom + 0.9);
  shape.lineTo(F.rootRadius, F.yBottom);
  shape.closePath();

  const geometry = new THREE.ExtrudeGeometry(shape, {
    depth: F.thickness, bevelEnabled: true, bevelThickness: 0.05,
    bevelSize: 0.07, bevelSegments: 1, curveSegments: 1
  });
  geometry.translate(0, 0, -F.thickness / 2);

  const items = [];
  for (let i = 0; i < F.azimuthDeg.length; i += 1) {
    items.push({ p: [0, 0, 0], r: [0, -F.azimuthDeg[i] * RK_DEG, 0], s: [1, 1, 1] });
  }
  const mesh = rkInstances(body, 'rocket-fins', geometry, materials.accent, items);

  return {
    mesh: mesh, count: F.azimuthDeg.length, azimuthDeg: F.azimuthDeg.slice(),
    rootRadius: F.rootRadius, tipRadius: F.tipRadius, y0: F.yBottom, y1: F.yTop
  };
}

/* Fine greebles: hatches, RCS pods, portholes, antennas and hazard plates.
 * Kept in their own group so the low quality tier can drop the small pieces
 * without touching the silhouette. */
function rkBuildDetails(body, materials) {
  const L = RK_LAYOUT;
  const fine = new THREE.Group();
  fine.name = 'rocket-detail-greebles';
  body.add(fine);

  /* access hatches and inspection plates on the core stage */
  const hatches = [];
  const hatchSpecs = [
    [10.5, 62, 1.5, 1.1], [13.2, 300, 1.2, 0.9], [16.0, 150, 1.6, 1.2],
    [19.4, 20, 1.1, 0.9], [22.0, 245, 1.4, 1.0], [24.6, 105, 1.2, 1.4],
    [11.8, 200, 0.9, 0.9], [17.4, 350, 1.0, 0.8]
  ];
  for (let i = 0; i < hatchSpecs.length; i += 1) {
    const spec = hatchSpecs[i];
    hatches.push(rkSurfaceItem(L.core.radius + 0.07, spec[0], spec[1] * RK_DEG, [0.16, spec[2], spec[3]]));
  }
  rkInstances(fine, 'rocket-hatches', RK_GEO.box, materials.trim, hatches);

  /* hazard plates low on the aft skirt, clear of the clamps and fins */
  const plates = [];
  const plateAzimuths = [78, 198, 258, 348];
  for (let i = 0; i < plateAzimuths.length; i += 1) {
    plates.push(rkSurfaceItem(L.skirt.radius + 0.06, 5.2, plateAzimuths[i] * RK_DEG, [0.14, 0.6, 1.1]));
  }
  rkInstances(fine, 'rocket-hazard-plates', RK_GEO.box, materials.warn, plates);

  /* RCS pods around the second-stage top, with radial control nozzles */
  const podAzimuths = [40, 130, 220, 310];
  const pods = [];
  const nozzles = [];
  for (let i = 0; i < podAzimuths.length; i += 1) {
    const azimuth = podAzimuths[i] * RK_DEG;
    pods.push(rkSurfaceItem(L.stage2.radius + 0.42, 34.9, azimuth, [0.7, 0.7, 0.9]));
    nozzles.push(rkSurfaceItem(L.stage2.radius + 0.72, 35.15, azimuth, [0.34, 0.44, 0.34], 'radial'));
  }
  rkInstances(fine, 'rocket-rcs-pods', RK_GEO.box, materials.trim, pods);
  rkInstances(fine, 'rocket-rcs-nozzles', RK_GEO.cylinder, materials.bell, nozzles, { castShadow: false });

  /* portholes and a pair of docking windows, emissive and bright */
  const windows = [];
  const windowSpecs = [
    [31.8, 55], [31.8, 175], [34.4, 235], [34.4, 15], [37.8, 95], [37.8, 275]
  ];
  for (let i = 0; i < windowSpecs.length; i += 1) {
    const spec = windowSpecs[i];
    const radius = spec[0] > 37 ? L.trim.radius : L.stage2.radius;
    windows.push(rkSurfaceItem(radius + 0.06, spec[0], spec[1] * RK_DEG, [0.2, 0.34, 0.34], 'radial'));
  }
  rkInstances(fine, 'rocket-portholes', RK_GEO.cylinder, materials.glow, windows, { castShadow: false, receiveShadow: false });

  /* beacon antennas on the fairing base with lit tips */
  const masts = [];
  const tips = [];
  const mastAzimuths = [135, 255, 15];
  for (let i = 0; i < mastAzimuths.length; i += 1) {
    const azimuth = mastAzimuths[i] * RK_DEG;
    masts.push(rkSurfaceItem(2.5, L.fairing.y0 + 0.9, azimuth, [0.09, 1.7, 0.09]));
    tips.push(rkSurfaceItem(2.5, L.fairing.y0 + 1.8, azimuth, [0.24, 0.24, 0.24]));
  }
  rkInstances(fine, 'rocket-antennas', RK_GEO.cylinder, materials.trim, masts);
  rkInstances(fine, 'rocket-antenna-tips', RK_GEO.sphere, materials.glow, tips, { castShadow: false, receiveShadow: false });

  return { group: fine, fine: fine };
}

/* ---------------------------------------------------------------------------
 * Rocket subsystem: placement on the pad, the vibration rig and the published
 * rocket-rig-handles contract.
 * ------------------------------------------------------------------------ */

const rocketSystem = {
  root: null,
  rig: null,
  body: null,
  handles: null,
  textures: null,
  materials: null,
  materialTextures: [],
  instanced: [],
  stages: [],
  parts: null,
  fins: null,
  anchors: [],
  details: null,
  seat: new THREE.Vector3(0, RK_LAYOUT.seatY, 0),
  restPose: { position: new THREE.Vector3(), quaternion: new THREE.Quaternion(), scale: new THREE.Vector3(1, 1, 1) },
  radius: RK_LAYOUT.radius,
  height: RK_LAYOUT.tipY,
  finTipRadius: RK_LAYOUT.fins.tipRadius,
  altitude: 0,
  autoAltitude: true,
  rigHold: false,
  time: 0,
  vibration: {
    request: 0,          // what a consumer asked for
    target: 0,           // request combined with the thrust coupling
    level: 0,            // smoothed amplitude actually applied
    thrustCoupling: 0.85,// how much of state.thrust feeds the shake
    maxOffset: 0.22,     // metres of lateral sway at full amplitude
    maxTilt: 0.005,      // radians of attitude wobble at full amplitude
    attack: 0.22,        // seconds to spin up
    release: 0.55,       // seconds to spin down
    returnTau: 0.6,      // seconds the released rig takes to settle home
    offset: new THREE.Vector3(),
    tilt: 0,
    settled: true
  },

  init(ctx) {
    const launchComplex = runtime.handles && runtime.handles.launchComplex
      ? runtime.handles.launchComplex : null;

    /* Seat on the published pad deck - never guess, never float. */
    let seatX = 0;
    let seatY = RK_LAYOUT.seatY;
    let seatZ = 0;
    if (launchComplex && launchComplex.vehicleSeat) {
      seatX = launchComplex.vehicleSeat.x;
      seatY = launchComplex.vehicleSeat.y;
      seatZ = launchComplex.vehicleSeat.z;
    } else if (launchComplex && launchComplex.pad) {
      seatY = launchComplex.pad.deckTopY;
    }
    this.seat.set(seatX, seatY, seatZ);

    const textures = rkCreateTextures();
    const materialTextures = [];
    const materials = rkCreateMaterials(textures, materialTextures);

    /* root (director) -> rig (vibration) -> body (geometry) */
    const root = new THREE.Group();
    root.name = 'rocket-vehicle';
    root.position.set(seatX, seatY, seatZ);
    const rig = new THREE.Group();
    rig.name = 'rocket-vibration-rig';
    root.add(rig);
    const body = new THREE.Group();
    body.name = 'rocket-body';
    rig.add(body);

    const stack = rkBuildStack(body, materials);
    const engines = rkBuildEngines(body, materials);
    const fins = rkBuildFins(body, materials);
    const details = rkBuildDetails(body, materials);

    ctx.scene.add(root);

    const instanced = [];
    body.traverse(function (object) {
      if (object.isInstancedMesh) instanced.push({ name: object.name, mesh: object, count: object.count });
    });

    this.root = root;
    this.rig = rig;
    this.body = body;
    this.group = root;          // generic name for consumers that look for a root
    this.vehicle = body;
    this.textures = textures;
    this.materials = materials;
    this.materialTextures = materialTextures;
    this.instanced = instanced;
    this.stages = stack.stages;
    this.parts = stack.parts;
    this.fins = fins;
    this.anchors = engines.anchors;
    this.bellMesh = engines.bellMesh;
    this.details = details;
    this.time = 0;
    this.altitude = 0;
    this.restPose.position.copy(rig.position);
    this.restPose.quaternion.copy(rig.quaternion);
    this.restPose.scale.copy(rig.scale);
    this.snapRigToRest();

    /* Consume the launch-complex clamp API: the jaws close on the real aft
     * body radius instead of the configured default, so they touch the hull. */
    if (launchComplex && typeof launchComplex.setClampReach === 'function') {
      launchComplex.setClampReach(this.radius);
    }

    const vibration = this.vibration;
    const handles = {
      root: root,
      rig: rig,
      body: body,
      rest: this.restPose,
      seat: { x: seatX, y: seatY, z: seatZ },
      baseY: seatY,
      height: this.height,
      radius: this.radius,
      finTipRadius: this.finTipRadius,
      bounds: {
        minY: seatY,
        maxY: seatY + this.height,
        minRadius: 0,
        maxRadius: this.finTipRadius
      },
      engineCount: engines.count,
      engineAnchors: engines.anchors,
      engineBellMesh: engines.bellMesh,
      engineAnchor: function (name) { return rocketSystem.engineAnchor(name); },
      vibration: vibration,
      setVibration: function (amount, options) { return rocketSystem.setVibration(amount, options); },
      addImpulse: function (amount) { return rocketSystem.addImpulse(amount); },
      returnToRest: function (immediate) { return rocketSystem.returnToRest(immediate); },
      resetRig: function () { return rocketSystem.snapRigToRest(); },
      setAltitude: function (metres) { return rocketSystem.setAltitude(metres); },
      rigHold: false,
      autoAltitude: true,
      stages: this.stages,
      parts: this.parts,
      fins: this.fins,
      instanced: instanced,
      instancedCount: instanced.length,
      contactReport: function () { return rocketSystem.contactReport(); },
      getState: function () { return rocketSystem.getState(); }
    };

    this.handles = handles;
    if (!runtime.handles) runtime.handles = {};
    runtime.handles.rocket = handles;
    runtime.rocket = this;

    state.rocket = state.rocket || {};
    state.rocket.seatY = seatY;
    state.rocket.radius = this.radius;
    state.rocket.height = this.height;
    state.rocket.engineCount = engines.count;
    state.rocket.level = 0;
    state.rocket.settled = true;
    state.rocket.altitude = 0;
    state.rocket.instancedCount = instanced.length;
    state.rocket.rigOffset = state.rocket.rigOffset || new THREE.Vector3();

    console.log('[LAUNCH_SCENE] rocket seated at y=' + seatY.toFixed(2) +
      ' radius=' + this.radius + ' height=' + this.height +
      ' engines=' + engines.count + ' instanced=' + instanced.length);
  },

  engineAnchor(name) {
    for (let i = 0; i < this.anchors.length; i += 1) {
      if (this.anchors[i].name === name || this.anchors[i].index === Number(name)) return this.anchors[i];
    }
    return null;
  },

  /* Stack radius at a height measured above the deck seat: how wide the hull is
   * where a clamp arm or hold-down grips it, and 0 where nothing is. */
  radiusAtHeight(localY) {
    const L = RK_LAYOUT;
    const y = Number(localY);
    if (!Number.isFinite(y)) return 0;
    if (y >= L.skirt.y0 && y <= L.skirt.y1) return L.skirt.radius;
    if (y >= L.core.y0 && y <= L.core.y1) return L.core.radius;
    if (y >= L.interstage.y0 && y <= L.interstage.y1) return L.interstage.radius;
    if (y >= L.stage2.y0 && y <= L.stage2.y1) return L.stage2.radius;
    if (y >= L.joint.y0 && y <= L.joint.y1) return L.joint.radius;
    if (y >= L.trim.y0 && y <= L.trim.y1) return L.trim.radius;
    /* the four hold-down posts are the only structure at deck level, and their
     * outer faces are at exactly the aft-body radius the jaws close on */
    if (y >= L.posts.y0 && y <= L.posts.y1) return L.posts.radius + L.posts.size * 0.5;
    if (y >= L.fairing.y0 && y <= L.fairing.tipY) {
      return rkFairingRadius((y - L.fairing.y0) / (L.fairing.tipY - L.fairing.y0));
    }
    return 0;
  },

  /* Where the vehicle meets the launch complex: deck height, base gap and, for
   * every clamp arm, the radius the closed jaws reach versus the hull radius
   * at that arm's height. */
  contactReport() {
    const launchComplex = runtime.handles && runtime.handles.launchComplex
      ? runtime.handles.launchComplex : null;
    const deckTopY = launchComplex && launchComplex.pad ? launchComplex.pad.deckTopY : null;
    const report = {
      seatY: this.seat.y,
      rootWorldY: this.root ? this.root.position.y : null,
      deckTopY: deckTopY,
      gap: deckTopY === null ? null : Number((this.seat.y - deckTopY).toFixed(4)),
      upright: true,          // the stack is built along +Y: nose cone up
      arms: []
    };
    if (!launchComplex) return report;
    const rigs = launchComplex.clampRigs.concat(launchComplex.holdDownRigs);
    for (let i = 0; i < rigs.length; i += 1) {
      const rig = rigs[i];
      const localY = deckTopY === null ? rig.height : rig.height - deckTopY;
      const contactRadius = rig.pivotRadius - rig.armLength - 0.6;
      report.arms.push({
        id: rig.id,
        kind: rig.kind,
        deckLocalY: Number(localY.toFixed(3)),
        closedRadius: Number(contactRadius.toFixed(3)),
        hullRadius: Number(this.radiusAtHeight(localY).toFixed(3)),
        clearance: Number((contactRadius - this.radiusAtHeight(localY)).toFixed(3))
      });
    }
    return report;
  },

  getState() {
    const world = new THREE.Vector3();
    if (this.root) this.root.getWorldPosition(world);
    return {
      registered: runtime.has('rocket'),
      seatY: this.seat.y,
      rootWorld: { x: Number(world.x.toFixed(3)), y: Number(world.y.toFixed(3)), z: Number(world.z.toFixed(3)) },
      height: this.height,
      radius: this.radius,
      tipWorldY: Number((this.seat.y + this.height + this.altitude).toFixed(3)),
      altitude: this.altitude,
      engines: this.anchors.length,
      stages: this.stages.length,
      instancedCount: this.instanced.length,
      vibration: {
        request: this.vibration.request,
        target: this.vibration.target,
        level: Number(this.vibration.level.toFixed(5)),
        settled: this.vibration.settled,
        offset: this.vibration.offset.clone(),
        tilt: this.vibration.tilt
      },
      rigPosition: this.rig ? this.rig.position.clone() : null,
      rigRotation: this.rig ? { x: this.rig.rotation.x, y: this.rig.rotation.y, z: this.rig.rotation.z } : null,
      rest: this.restPose.position.clone()
    };
  },

  /* ---- vibration rig ---------------------------------------------------- */

  setVibration(amount, options) {
    const settings = options || {};
    const v = this.vibration;
    v.request = clamp01(amount);
    if (settings.thrustCoupling !== undefined) v.thrustCoupling = clamp01(settings.thrustCoupling);
    if (settings.attack !== undefined) v.attack = Math.max(0, Number(settings.attack) || 0);
    if (settings.release !== undefined) v.release = Math.max(0, Number(settings.release) || 0);
    if (settings.returnTau !== undefined) v.returnTau = Math.max(0, Number(settings.returnTau) || 0);
    if (settings.immediate === true) {
      v.level = v.request;
      this.applyRigPose(0);
    }
    return v.request;
  },

  /* Momentary kick: the level jumps now and decays with the release tau. */
  addImpulse(amount) {
    const v = this.vibration;
    v.level = clamp01(v.level + clamp01(amount));
    v.request = Math.max(v.request, v.level);
    this.applyRigPose(0);
    return v.level;
  },

  returnToRest(immediate) {
    const v = this.vibration;
    v.request = 0;
    v.target = 0;
    if (immediate === true) return this.snapRigToRest();
    return v.level;
  },

  /* Exact rest pose: position, quaternion and scale copied from the published
   * rest transform, with every vibration readout cleared. */
  snapRigToRest() {
    if (!this.rig) return false;
    this.rig.position.copy(this.restPose.position);
    this.rig.quaternion.copy(this.restPose.quaternion);
    this.rig.scale.copy(this.restPose.scale);
    const v = this.vibration;
    v.level = 0;
    v.target = 0;
    v.request = 0;
    v.offset.set(0, 0, 0);
    v.tilt = 0;
    v.settled = true;
    return true;
  },

  setAltitude(metres) {
    const value = Math.max(0, Number(metres) || 0);
    state.altitude = value;
    this.altitude = value;
    if (this.root && !this.autoAltitude) this.root.position.y = this.seat.y + value;
    return value;
  },

  /* Pose the rig: procedural shake while vibrating, a damped trip home to the
   * published rest pose once released, and hands off when a consumer holds it. */
  applyRigPose(delta) {
    const rig = this.rig;
    if (!rig) return;
    const rest = this.restPose;
    const v = this.vibration;
    const level = v.level;

    if (level > 1e-4) {
      const t = this.time;
      const amp = level * v.maxOffset;
      const ox = Math.sin(t * 41.3) * amp;
      const oy = Math.sin(t * 33.1 + 2.6) * amp * 0.35;
      const oz = Math.sin(t * 57.7 + 1.7) * amp * 0.9;
      const tilt = level * v.maxTilt;
      rig.position.set(rest.position.x + ox, rest.position.y + oy, rest.position.z + oz);
      rig.quaternion.setFromEuler(rkScratchEuler.set(Math.sin(t * 47.1 + 0.6) * tilt, 0, Math.sin(t * 53.3 + 2.1) * tilt));
      v.offset.set(ox, oy, oz);
      v.tilt = tilt;
      v.settled = false;
      return;
    }

    v.tilt = 0;
    if (this.rigHold) {
      v.offset.copy(rig.position).sub(rest.position);
      v.settled = v.offset.lengthSq() < 1e-8;
      return;
    }

    /* released: drift home, then snap to the exact rest transform */
    const tau = v.returnTau;
    const k = tau > 0 ? 1 - Math.exp(-Math.max(0, delta) / tau) : 1;
    rig.position.lerp(rest.position, k);
    rig.quaternion.slerp(rest.quaternion, k);
    rig.scale.lerp(rest.scale, k);
    if (rig.position.distanceToSquared(rest.position) < 1e-6) rig.position.copy(rest.position);
    if (1 - Math.abs(rig.quaternion.dot(rest.quaternion)) < 1e-8) rig.quaternion.copy(rest.quaternion);
    v.offset.copy(rig.position).sub(rest.position);
    v.settled = v.offset.lengthSq() < 1e-8 && rig.quaternion.equals(rest.quaternion);
  },

  update(dt, currentState) {
    const delta = Math.max(0, Number(dt) || 0);
    const shared = currentState || state;
    this.time += delta;

    /* consumer overrides published on the handles object */
    if (this.handles) {
      if (typeof this.handles.autoAltitude === 'boolean') this.autoAltitude = this.handles.autoAltitude;
      this.rigHold = this.handles.rigHold === true;
    }

    /* ascent translation: the shared director state owns altitude, the root
     * follows it until a consumer takes manual control. */
    if (this.root && this.autoAltitude) {
      const altitude = Math.max(0, Number(shared.altitude) || 0);
      this.altitude = altitude;
      this.root.position.y = this.seat.y + altitude;
    } else if (this.root) {
      this.altitude = Math.max(0, this.root.position.y - this.seat.y);
    }

    /* shake request plus the thrust coupling the director drives */
    const v = this.vibration;
    const target = clamp01(Math.max(clamp01(v.request), clamp01(shared.thrust) * clamp01(v.thrustCoupling)));
    v.target = target;
    const tau = target > v.level ? v.attack : v.release;
    if (tau > 0) v.level += (target - v.level) * (1 - Math.exp(-delta / tau));
    else v.level = target;
    if (target <= 1e-4 && v.level <= 1e-4) v.level = 0;

    this.applyRigPose(delta);

    if (shared.rocket) {
      shared.rocket.level = v.level;
      shared.rocket.settled = v.settled;
      shared.rocket.altitude = this.altitude;
      if (shared.rocket.rigOffset) shared.rocket.rigOffset.copy(v.offset);
    }
  },

  onQualityChange(qualityTier) {
    /* the small greebles are pure decoration: drop them on the lowest tier and
     * keep the silhouette, the panels and the engine cluster intact. */
    if (this.details && this.details.fine) {
      this.details.fine.visible = qualityTier.id !== 'low';
    }
  },

  dispose(ctx) {
    if (this.root && ctx && ctx.scene) ctx.scene.remove(this.root);
    if (this.root) {
      this.root.traverse(function (object) {
        if (object.isMesh || object.isInstancedMesh) {
          if (object.geometry) object.geometry.dispose();
        }
      });
    }
    Object.keys(RK_GEO).forEach(function (key) {
      if (RK_GEO[key] && RK_GEO[key].dispose) RK_GEO[key].dispose();
    });
    if (this.materials) {
      Object.keys(this.materials).forEach(function (key) {
        if (this.materials[key] && this.materials[key].dispose) this.materials[key].dispose();
      }, this);
    }
    if (this.textures) {
      Object.keys(this.textures).forEach(function (key) {
        if (this.textures[key] && this.textures[key].dispose) this.textures[key].dispose();
      }, this);
    }
    this.materialTextures.forEach(function (texture) { if (texture && texture.dispose) texture.dispose(); });

    this.root = null;
    this.rig = null;
    this.body = null;
    this.group = null;
    this.vehicle = null;
    this.textures = null;
    this.materials = null;
    this.materialTextures = [];
    this.instanced = [];
    this.stages = [];
    this.parts = null;
    this.fins = null;
    this.anchors = [];
    this.bellMesh = null;
    this.details = null;
    this.handles = null;
    this.snapRigToRest();
    if (runtime.handles) runtime.handles.rocket = null;
    runtime.rocket = null;
  }
};

runtime.register('rocket', rocketSystem);

/* ---------------------------------------------------------------------------
 * SECTION: exhaust - layered engine fire, thrust-driven plume, warm engine
 * lighting and the heat-shimmer veil around the exhaust.
 * ---------------------------------------------------------------------------
 * The propulsive core of the scene. It owns exactly one input - thrust - and
 * derives every visual and every published number from that input plus the
 * vehicle altitude, so later phases (smoke, dust, foliage reaction, camera,
 * perf) can all react to one physical cause instead of inventing private
 * timers.
 *
 * ONE THRUST SIGNAL - the documented ignition ramp
 *   runtime.state.thrust (0..1, owned by the director) is sampled every frame;
 *   the exhaust API can push the same signal with setThrust(value). Both feed
 *   the only dynamic in this section:
 *     rising : level = min(requested, level + dt / EX_SPEC.ignitionSeconds)
 *     falling: level = level + (requested - level) * (1 - exp(-dt / tau))
 *   so the fire is dark at t = 0, reaches the requested throttle in at most
 *   EX_SPEC.ignitionSeconds (3.2 s) and eases back down over ~0.55 s. Flame
 *   brightness, core size, flame lengths, plume length, gust radius, engine
 *   lights and the heat shimmer are all pure functions of level and altitude.
 *
 * FLAME LAYERS - additive shaders authored in code, no textures, no bloom
 *   core   near-white hot core cone on every engine bell
 *   glow   saturated warm glow cone wrapped around the core
 *   trail  two long licking exhaust tongues per bell (the flame trails)
 *   Each layer is a single InstancedMesh whose per-instance matrix is the
 *   world matrix of an engine-bell anchor published by rocket-rig-handles, so
 *   the fire is welded to the bells instead of a hard-coded offset and follows
 *   the vehicle root and the vibration rig automatically.
 *
 * EXHAUST PLUME
 *   A world-space additive column (inner hot jet + outer soft jet) whose length
 *   is a pure function of level and altitude: a short bright jet on the pad and
 *   a long, thinning trail that reaches towards the ground during ascent.
 *
 * WARM LIGHT AND HEAT
 *   Three warm point lights (engine cluster, pad deck, tower) plus an additive
 *   ground glow disc warm the aft body, the deck and the tower lattice; a
 *   heat-shimmer veil around the plume refracts the frame behind it.
 *
 * PUBLISHED API - LAUNCH_SCENE.exhaust (exhaust-emitter-api)
 *   setThrust(throttle 0..1)  the single input (also writes state.thrust)
 *   throttle / thrust / level / ignition   0..1 read-only derived values
 *   anchors[] / engineAnchor(name|index) / anchorCount / bellExitRadius
 *   flameScale               0..1 overall flame multiplier actually applied
 *   flameLayers              { core, glow, trail } -> { length, width, count }
 *   plumeBase / plumeAxis    world position + world direction of the plume
 *   plumeLength / plumeWidth metres rendered this frame
 *   plumeSegments[]          world space samples along the plume:
 *                            { index, t (0 base -> 1 tip), position (Vector3),
 *                              radius, length, worldY, spread, active }
 *   gustRadius               metres of sideways hot-gas gust
 *   heat                     { radius, intensity } near-field heat field
 *   shimmer                  { group, intensity, enabled, refracted }
 *   lights[]                 { name, light, intensity }
 *   groundGlow               { mesh, intensity, radius }
 *   getState()               numbers-only snapshot, mirrored to state.exhaust
 * ------------------------------------------------------------------------ */
