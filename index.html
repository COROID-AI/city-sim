<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04070f" />
    <!-- Inline vector favicon: no downloaded assets, no extra requests. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23040a12'/%3E%3Cpath d='M8 24 16 8l8 16' stroke='%2335f0ff' stroke-width='2.4' fill='none'/%3E%3C/svg%3E"
    />
    <title>Coroid — Holographic Factory Floor</title>
    <meta
      name="description"
      content="Coroid is an autonomous software factory: agent lanes plan, build, verify and ship work while you watch the holographic factory floor."
    />
  </head>
  <body>
    <!-- The runtime mounts its WebGL canvas inside this full-viewport host. -->
    <div id="boot" class="boot-shell">
      <div class="boot-splash" id="boot-splash">
        <p class="boot-splash__mark">COROID</p>
        <p class="boot-splash__tagline">
          An autonomous software factory — lanes of agents plan, build, verify and ship while the floor
          streams its hologram.
        </p>
        <p class="boot-splash__status" id="boot-status">Calibrating the emitters…</p>
      </div>
    </div>
    <noscript>
      Coroid renders a live holographic factory floor and needs JavaScript and WebGL enabled.
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
