<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tetris</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Crect%20width='16'%20height='16'%20fill='%2322c1e3'/%3E%3C/svg%3E"
    />
    <style>
      body {
        background: #0b0e14;
        color: #e8edf5;
        font-family: system-ui, sans-serif;
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      #app {
        text-align: center;
        padding: 1rem 1.5rem;
      }

      h1 {
        margin: 0 0 0.25rem;
        color: #e8edf5;
      }

      p.controls {
        margin: 0 0 1rem;
        font-size: 0.9rem;
        color: #9aa5b5;
      }

      canvas {
        border: 1px solid #2a3350;
        border-radius: 4px;
        max-width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>Tetris</h1>
      <p class="controls">
        Arrow keys: Up rotate &middot; Left / Right move &middot; Down soft
        drop
      </p>
      <canvas
        id="canvas"
        role="img"
        aria-label="Tetris game board: 10 columns by 20 rows. Use the arrow keys to play."
      ></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
