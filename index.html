<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Snake</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e1b2a;
      }

      #game {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      /* HUD overlay container: createHud builds its DOM subtree inside here. */
      #hud {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        padding: 14px 18px;
        font-family: system-ui, -apple-system, sans-serif;
        color: #ffffff;
        pointer-events: none;
      }

      .hud-score-line {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        font-size: 18px;
        font-weight: 600;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
      }

      .hud-game-over {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: rgba(10, 20, 35, 0.82);
        color: #ffffff;
        text-align: center;
      }

      /* The [hidden] attribute must win over the flex display above. */
      .hud-game-over[hidden] {
        display: none;
      }

      .hud-game-over h2 {
        margin: 0;
        font-size: 44px;
        color: #ff5a5a;
      }

      .hud-game-over p {
        margin: 0;
        font-size: 18px;
      }

      .hud-restart-prompt {
        color: #9dffc3;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
